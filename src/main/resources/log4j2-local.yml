Configuration:
  name: spring-boot-4-local
  status: WARN

  Properties:
    Property:
      - name: "log-path"
        value: "./logs"
      - name: "charset-UTF-8"
        value: "UTF-8"
      - name: "layout-pattern"
        value: "%clr{%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}{faint} %clr{%5p} %clr{%-5pid}{magenta} %clr{---}{faint} %clr{[%15.15t]}{faint} %clr{%-40.40C{1.}}{cyan} %clr{:}{faint} %m%n%wEx"

  Appenders:
    Console:
      - name: console-appender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: ${layout-pattern}

  Loggers:
    Root:
      level: INFO
      AppenderRef:
        - ref: console-appender

    Logger:
      - name: org.springframework
        level: INFO
        additivity: false
        AppenderRef:
          - ref: console-appender

      - name: packeage_root_path
        level: INFO
        additivity: false
        AppenderRef:
          - ref: console-appender

      # P6Spy 전용 로거 설정
      - name: com.p6spy.engine.spy.appender
        level: INFO
        additivity: false
        AppenderRef:
          - ref: console-appender