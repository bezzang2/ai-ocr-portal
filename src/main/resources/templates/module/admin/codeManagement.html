<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
<meta charset="UTF-8">

<title>코드관리 | AI OCR 서류판독시스템</title>
<link rel="stylesheet" th:href="@{/css/main.css}">

</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
	<symbol id="svg_search" viewBox="0 0 11.5 11.5" >
		<path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
	</symbol>
</svg>
<main class="content">
	<!-- 페이지 헤더 — get_design_context(617:10047) 실측. "Btn" 슬롯(617:10049)이 빈 채로
	     실측돼 버튼 없이 제목만 반영했다. -->
	<div class="page-header">
	  <h1 class="page-header__title">코드관리</h1>
	</div>
	
	<div class="layout-list">
        <!-- 검색영역 — get_design_context(617:10554) 실측.
             2026-08-20: 새로고침/조회 버튼을 .search-area__row 바깥의 별도 .search-area__actions로
             두던 구조를, 관리자>감사로그(audit-log.html)와 동일하게 마지막 .search-area__item의
             .search-area__combo 안으로 옮겼다 — 필터 줄바꿈 시에도 버튼이 그 항목 옆에 붙어
             있도록 하는 감사로그 패턴 재사용. -->
        <form class="search-area">
            <div class="search-area__row">
                <div class="search-area__item">
              		<label class="search-area__label" for="code-no">코드 그룹</label>
              		<div class="search-area__combo">
                		<input id="code-no" class="input input--w120" type="text" placeholder="코드번호">
                		<input id="code-name" class="input input--w120" type="text" placeholder="코드명">
                		<div class="search-area__actions">
                  			<button type="button" class="btn-icon" id="btn_refresh">
                    			<img th:src="@{/images/icons/buttons/ic-16-refresh.svg}" alt="">
                  			</button>
                  			<button type="button" class="btn-outline-primary" id="btn_search" style="width:80px">
                    			<span class="btn-icon-slot">
                    				<svg width="11.5" height="11.5" fill="none" aria-hidden="true">
                    					<use href="#svg_search" />
                    				</svg>
                    			</span>
                    			<span>조회</span>
                  			</button>
                		</div>
              		</div>
            	</div>
          	</div>
        </form>

        <!-- 코드그룹 목록(좌) + 코드값 목록(우) — get_design_context(617:10628) 실측.
             Figma 원본 제목이 두 곳 다 "서식조회 목록"으로 돼 있었으나(다른 화면 템플릿을
             복사하면서 라벨을 못 고친 것으로 보이는 오류) 사용자 확인 후 "코드 그룹"/"코드 상세"로
             교체했다(2026-08-19). -->
        <div style="display:flex; gap:24px; align-items:flex-start; width:100%">

          <!-- 좌측: 코드그룹 목록 — get_design_context(617:10083) 실측 기반.
               [TEST-ONLY, 2026-08-19] 사용자 요청으로 이 페이지에서만 실험 중 — 패널
               자체의 폭도 px min/max 클램프 대신 %로 바꿨다. 비율은 직전에 실측했던
               "좌측 max 460px : 우측 min 740px" (460+740=1200 기준) 를 그대로 옮긴 것
               (460/1200=38.33%, 740/1200=61.67%) — 화면 폭이 바뀌어도 두 패널이 항상 이
               비율을 유지한 채 같이 늘고 준다. 24px 갭을 calc()로 양쪽에서 절반(12px)씩
               미리 빼서, 두 패널 %의 합(100%)+갭이 컨테이너 폭을 넘지 않게 했다. 표는
               이미 width:100%라 패널 폭이 바뀌면 그대로 따라간다(풀로 채움). 표 내부 칼럼
               비율(colgroup %)은 이전 실측 그대로 유지 — 패널이 늘고 줄 때 칼럼도 항상
               같은 비율로 같이 늘고 준다.
               2026-08-20: 사용자가 상호작용을 명확히 함 — 이 표는 "한 번 클릭 = 행 선택
               (오른쪽 코드상세 패널 연동, is-selected)", "더블클릭 = 편집(코드번호·코드명
               둘 다 input으로 전환)"이 별개 동작이다. 두 동작 모두 js/table-row-edit.js
               한 파일 안에 있다(선택은 data-row-select, 편집 트리거 오버라이드는
               data-edit-trigger="dblclick") — 처음엔 선택 로직을 별도 파일(table-row-select.js)로
               만들었다가, "행 클릭 시 클래스 하나만 토글"이라는 동일한 뼈대를 쓰는 로직을
               파일만 나누는 건 불필요한 중복이라는 지적을 받아 이 파일로 합쳤다. 같은 표에서
               서로 다른 이벤트(click vs dblclick)만 듣기 때문에 두 동작이 충돌하지 않는다. -->
			<div class="task-section" style="flex:0 0 calc(38.33% - 12px)">
            	<div class="task-section__header">
              		<span class="task-section__title">코드 그룹</span>
              		<div class="task-section__actions">
              			<button type="button" class="btn-neutral" style="width:80px">
	                  		<img th:src="@{/images/icons/buttons/ic-16-plus.svg}" alt="">
	                  		<span th:text="행추가"></span>
	                	</button>
	                	<button type="button" class="btn-neutral" style="width:80px">
	                  		<img th:src="@{/images/icons/buttons/ic-16-trash.svg}" alt="">
	                  		<span th:text="행삭제"></span>
	                	</button>
	              	</div>
	            </div>
	            <table class="table" style="table-layout:fixed; width:100%" data-row-select data-edit-trigger="dblclick">
	            	<colgroup>
	                	<col style="width:30.43%">
	                	<col style="width:69.57%">
	              	</colgroup>
	              	<thead>
	                	<tr>
	                  		<th>코드번호</th>
	                  		<th>코드명</th>
	                	</tr>
	              	</thead>
	              	<tbody id="group_area">
	             	</tbody>
	          	</table>
          	</div>

          	<!-- 우측: 코드값 목록 — get_design_context(617:10872) 재실측(2026-08-20,
               "신청부서"/"최종변경일자" → "유효시작일"/"유효마감일"로 라벨 교체. 두 칼럼 다
               날짜값이라 지금까지의 "부서명인데 날짜가 들어있는 오류"가 아니라 원래부터
               유효기간 칼럼이었던 것으로 확인됐다 — 이전 코멘트의 "Figma 원본 오류" 추정은
               철회한다. "유효마감일"도 이번에 Figma에서 새로 datepicker(ic/24/insert_invitation)로
               바뀌어 유효시작일과 동일하게 cell-text/cell-input(type=date) 쌍을 갖는다.
               코드번호는 항상 텍스트(고유 식별자라 미편집), 나머지 5칼럼은 전 행에
               cell-text/cell-input을 둬서 어떤 행이든 편집 가능하게 했다(이전엔 첫 행만
               가능했는데, 사용자가 "더블클릭하면 셀이 활성화"라고 확인해줘 특정 행 하나로
               고정할 이유가 없어짐). 편집 트리거는 table-row-edit.js 기본값인 click이 아니라
               data-edit-trigger="dblclick"로 오버라이드했다 — 이 표가 속한 화면은 좌측
               코드그룹 표에서 "한 번 클릭 = 행 선택(코드상세 연동)"을 이미 쓰고 있어, 오른쪽도
               같은 규칙(클릭=선택/포커스, 더블클릭=편집)으로 통일했다. -->
			<div class="task-section" style="flex:0 0 calc(61.67% - 12px)">
            	<div class="task-section__header">
              		<span class="task-section__title">코드 상세</span>
              		<div class="task-section__actions">
              			<button type="button" class="btn-neutral" style="width:80px">
	                  		<img th:src="@{/images/icons/buttons/ic-16-plus.svg}" alt="">
	                  		<span th:text="행추가"></span>
	                	</button>
	                	<button type="button" class="btn-neutral" style="width:80px">
	                  		<img th:src="@{/images/icons/buttons/ic-16-trash.svg}" alt="">
	                  		<span th:text="행삭제"></span>
	                	</button>
	                	<button type="button" class="btn-neutral" style="width:80px">
	                  		<img th:src="@{/images/icons/buttons/ic-16-check.svg}" alt="">
	                  		<span th:text="저장"></span>
	                	</button>
	              	</div>
            	</div>
            	<table class="table" style="table-layout:fixed; width:100%" data-edit-trigger="dblclick">
              		<colgroup>
		                <col style="width:40%">
		                <col style="width:35%">
		                <col style="width:10%">
		                <col style="width:15%">
	              	</colgroup>
              		<thead>
                		<tr>
							<th>코드번호</th>
							<th>코드명</th>
							<th>순서</th>
							<th>사용여부</th>
						</tr>
              		</thead>
              		<tbody id="code_area">
		            </tbody>
            	</table>
          	</div>
		</div>
    </div>
</main>
<div th:insert="~{common/commonModals :: commonModals}"></div>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/lnb.js}"></script>
<script th:src="@{/js/date-input.js}"></script>
<script th:src="@{/js/table-row-edit.js}"></script>

<script th:src="@{/js/table-col-select-all.js}"></script>
<script th:src="@{/js/table-row-link.js}"></script>
<script th:src="@{/js/table-sort-toggle.js}"></script>
<script th:src="@{/js/common.js}"></script>
<!-- inline JS 영역-->
<script th:inline="javascript" type="text/javascript">
$(function(){
	$("#btn_refresh, #btn_search").on("click", function(){
		searchGroup();
	});
	
	//	그룹 코드 목록 조회
	searchGroup = function(){
		let param = {
			cdGroup : $("#code-no").val(),
			cdGroupNm : $("#code-name").val(),
		};
		
		fetch(contextPath+"module/admin/searchGropCode", {
	        method: "POST",
	        headers: {
	          "Content-Type": "application/json"
	        },
	        body: JSON.stringify(param)
		})
        .then(response => {
            if (!response.ok) {
                openErrorModal("조회 오류");
                return;
            }
            return response.json();
        })
        .then(data => {
        	console.log(data);
        	drawGroupList(data.list);
        })
        .catch(error => {
            console.error(error);
            return;
        })
	}
	
	//	항위 코드 목록 조회
	searchCode = function(groupCd){
		fetch(contextPath+"module/admin/selectCodeDetail", {
	        method: "POST",
	        headers: {
	          "Content-Type": "application/json",
	        },
	        body: JSON.stringify({
	          cdGroup: groupCd
	        })
	    })
	    .then(response => {
	    	if (!response.ok) {
	        	openErrorModal("상세 조회 실패");
	            return;
	        }
			return response.json();
		})
	    .then(data => {
			drawCodeList(data.detailList);
		})
	    .catch(error => {
	    	console.error(error);
	        return;
		});
	}
	
	drawGroupList = function(list){
		$("#group_area").empty();
		
		let html = ``;
		
		if(list.length == 0 ){
			html = `
				<tr>
					<td colspan="2" style="text-align: center;">조회된 데이터가 없습니다.</td>
				</tr>
			`;
			$("#group_area").append(html);
		}
		else{
			list.forEach(function(item, index){
				html = `
					<tr onclick="searchCode('${item.cdGroup}');">
		        		<td>
		        			<span class="cell-text">${item.cdGroup}</span>
		        			<input class="input cell-input input--sm" type="text" name="" value="${item.cdGroup}" />
		        		</td>
		        		<td>
		        			<span class="cell-text">${item.cdGroupNm}</span>
		        			<input class="input cell-input input--sm" type="text" value="${item.cdGroupNm}" />
		        		</td>
		        	</tr>
		        `;
				$("#group_area").append(html);
			});
		}
	}
	
	drawCodeList = function(list){
		$("#code_area").empty();
		
		let html = ``;
		
		if(list.length == 0 ){
			html = `
				<tr>
					<td colspan="6" style="text-align: center;">조회된 데이터가 없습니다.</td>
				</tr>
			`;
			$("#code_area").append(html);
		}
		else{
			list.forEach(function(item, index){
				html = `
					<tr>
		        		<td>
		        			<span class="cell-text">${item.cdVal}</span>
		        			<input class="input cell-input input--sm cd-val" type="text" value="${item.cdVal}">
		        		</td>
		        		<td>
		        			<span class="cell-text">${item.cdNm}</span>
		        			<input class="input cell-input input--sm cd-nm" type="text" value="${item.cdNm}">
		        		</td>
		        		<td>
		        			<span class="cell-text">${item.lnupSer}</span>
		        			<input class="input cell-input input--sm lnup-ser" type="text" value="${item.lnupSer}">
		        		</td>
		        		<td>
		        			<span class="cell-text">${item.uzYn}</span>
		        			<input class="input cell-input input--sm uz-yn" type="text" value="${item.uzYn}">
		        		</td>
		        	</tr>
		        `;
				$("#code_area").append(html);
			});
		}
	}
});
</script>
</body>
</html>
