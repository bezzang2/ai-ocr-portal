<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
  <meta charset="UTF-8">

<title>코드관리 | AI OCR 서류판독시스템</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- inline JS 영역-->
  <script th:inline="javascript" type="text/javascript">

    document.addEventListener('DOMContentLoaded',function (){

      // 메뉴 오픈시 lnb쪽 메뉴 활성화 부분
      const params = new URLSearchParams(location.search);
      const menuId = params.get("menuId");

      if(menuId) {
        openLnb(menuId);
      }

      /**********************************************************************
       * 코드그룹 => 행추가 이벤트
       ***********************************************************************/
      const btnGroupAdd = document.getElementById("btnGroupAdd");
      if(btnGroupAdd){
        btnGroupAdd.addEventListener("click", function () {
          const tBody = document.getElementById("groupCodeBody");
          // 기존 선택 해제
          tBody.querySelectorAll("tr").forEach(function (row){
            row.classList.remove("is-selected");
          });
          const tr = document.createElement("tr");

          // 신규행 표시용
          tr.dataset.newRow = "Y";
          tr.classList.add("is-selected");
          tr.innerHTML += '<td>' +
                  '<span class="cell-text" style="display: none;"></span>' +
                  '<input class="input call-input input--sm cd-group" type="text" value="" placeholder="코드번호">'+
                  '</td>'+
                  '<td>' +
                  '<span class="cell-text" style="display: none;"></span>' +
                  '<input class="input call-input input--sm cd-group-nm" type="text" value="" placeholder="코드명">'+
                  '</td>';

          tBody.appendChild(tr);

          const detailBody = document.getElementById("codeDetailBody");
          detailBody.innerHTML = "";

          // 코드번호 포커스
          tr.querySelector(".cd-group").focus();
        })
      }

      /**********************************************************************
       * 코드그룹 => 행 클릭 이벤트
       ***********************************************************************/
      const groupCodeBody = document.getElementById("groupCodeBody");
      if(groupCodeBody){
        groupCodeBody.addEventListener("click", function (e) {
          // 버튼/input/select 클릭 시 행조회 이벤트 타지 않게
          if(e.target.closest("button,input,select")){
            return;
          }
          const row = e.target.closest("tr");
          if(!row){return;}
          groupCodeBody.querySelectorAll("tr").forEach(function (tr) {
            tr.classList.remove("is-selected");
          });
          row.classList.add("is-selected");
          if(row.dataset.newRow === "Y"){
            const datailBody = document.getElementById("codeDetailBody");
            if(datailBody){
              datailBody.innerHTML = "";
            }
            return;
          }
          const cdGroup = row.dataset.cdGroup;
          if(cdGroup){
            selectCodeDetail(cdGroup);
          }

        });
      }

      /**********************************************************************
       * 코드그룹 => 행삭제 이벤트
       ***********************************************************************/
      const btnGroupDelete = document.getElementById("btnGroupDelete");
      if(btnGroupDelete){
        btnGroupDelete.addEventListener("click", function () {
          const tBody = document.getElementById("groupCodeBody");
          const selectedRow = tBody.querySelector("tr.is-selected");
          if (!selectedRow) {
            openInformationModal("삭제할 행을 선택하세요.");
            return;
          }
          // 신규로 추가한 행이면 화면에서 바로 삭제
          if (selectedRow.dataset.newRow === "Y") {
            selectedRow.remove();
            return;
          }
          // 기존 DB데이터면 서비스 호출
          const cdGroup = selectedRow.dataset.cdGroup;
          if (!cdGroup) {
            openInformationModal("코드그룹을 확인할 수 없습니다.");
            return;
          }
          const param = {cdGroup:cdGroup};
          openConfirmModal("선택한 코드그룹 삭제시 코드상세도 삭제하시겠습니까?", function () {
            fetch(contextPath+"module/admin/deleteGroupCode", {
              method: "POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify(param)
            })
                    .then(response => {
                      if (!response.ok) {
                        openErrorModal("삭제 실패");
                        return;
                      }
                      return response.json()
                    })
                    .then(data => {
                      if (data.result === "SUCCESS") {
                        openSuccessModal("삭제 되었습니다.");
                        searchGropCode();
                      } else {
                        openErrorModal("삭제 실패 :" + data.message);
                        return;
                      }
                    })
                    .catch(error => {
                      console.error(error);
                      openErrorModal("삭제 중 오류가 발행했습니다.");
                      return;
                    });
          });
        });

      }

      /**********************************************************************
       * 코드상세 =>  행삭제 이벤트
       ***********************************************************************/
      const btnDetailDelete = document.getElementById("btnDetailDelete");
      if(btnDetailDelete){
        btnDetailDelete.addEventListener("click", function () {
          const tBody = document.getElementById("codeDetailBody");
          const selectedRow = tBody.querySelector("tr.is-selected");
          if (!selectedRow) {
            openInformationModal("삭제할 행을 선택하세요.");
            return;
          }
          // 신규로 추가한 행이면 화면에서 바로 삭제
          if (selectedRow.dataset.newRow === "Y") {
            selectedRow.remove();
            return;
          }
          // 기존 DB데이터면 서비스 호출
          const cdGroup = selectedRow.dataset.cdGroup;
          const cdVal = selectedRow.dataset.cdVal;
          //console.log("cdGroup>>>"+cdGroup);
          //console.log("cdVal>>>"+cdVal);
          if (!cdGroup || !cdVal) {
            openErrorModal("삭제할 코드정보를 확인할 수 없습니다.");
            return;
          }

          openConfirmModal("선택한 코드상세를 삭제하시겠습니까?", function () {
            fetch(contextPath+"module/admin/deleteCodeDetail", {
              method: "POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({
                cdGroup:cdGroup,
                cdVal:cdVal
              })
            })
            .then(response => {
              if (!response.ok) {
                throw new Error("삭제 요청 실패");
              }
              return response.json()
            })
            .then(data => {
              if (data.result === "SUCCESS") {
                selectedRow.remove();
                openSuccessModal("삭제 되었습니다.");
              } else {
                openErrorModal(data.message);
                return;
              }
            })
            .catch(error => {
              console.error(error);
              openErrorModal("삭제 중 오류가 발행했습니다.");
              return;
            });
          });
        });
      }

      /**********************************************************************
       * 코드상세 =>  행 클릭 이벤트
       ***********************************************************************/
      const codeDetailBody = document.getElementById("codeDetailBody");
      if(codeDetailBody){
        codeDetailBody.addEventListener("click", function (e) {
          const row = e.target.closest("tr");
          if(!row){return;}
          // 조회된 데이터가 없습니다. 행은 선택 제외
          if(row.querySelector("td[colspan]")){
            return;
          }
          // 기존 선택 해제
          codeDetailBody.querySelectorAll("tr").forEach(function (tr) {
            tr.classList.remove("is-selected");
          });
          // 현재 선택 행
          row.classList.add("is-selected");
        });
      }

      document.addEventListener("click",function (e) {
        const btn = e.target.closest("[data-action-cd]");

        if(!btn){ return;}

        const actionCd = btn.dataset.actionCd;
        const areaCd = btn.dataset.areaCd;
        //console.log("actionCd===>>>",actionCd)
        //console.log("areaCd===>>>",areaCd)
        if(areaCd === "DETAIL"){
          switch (actionCd){
            case "SAVE":
              saveGroupCode();
              break;
            case "ADD":
              addDetailRow(e);
              break;
          }
        }else if(areaCd === "SEARCH"){
          switch (actionCd) {
            case "LIST":
              searchGropCode();
              break;
          }
        }
      })

      /*******************************************************
       *  조회 조건 엔터키 이벤트
       * *******************************************************/
      document.addEventListener("keydown",function (e) {
        if(e.key !== "Enter"){ return;}
        if(e.target.id === "code-no" || e.target.id === "code-name"){
          e.preventDefault();
          searchNotice();
        }
      })

    });

    /**********************************************************************
     * 세로고침 이벤트
     ***********************************************************************/
    function searchRefresh(){
      document.getElementById("cdGroup").value = "";
      document.getElementById("cdGroupNm").value = "";
    }

    /**********************************************************************
     * 코드그룹 => 조회 함수
     ***********************************************************************/
    function searchGropCode(){
      console.log("그룹코드 조회 시작 : ");

      const param = {
        cdGroup: document.getElementById("code-no").value,
        cdGroupNm: document.getElementById("code-name").value
      };

      fetch(contextPath+"module/admin/searchGropCode", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(param)
      })
              .then(response => {
                if (!response.ok) {
                  openErrorModal("조회 오류");
                  return;
                }
                return response.json();
              })
              .then(data => {

                drawGropCodeList(data.list);

              })
              .catch(error => {
                console.error(error);
                return;
              })
    }

    /**********************************************************************
     * 코드그룹 => 조회 후 데이터 매핑 함수
     ***********************************************************************/
    function drawGropCodeList(list){
      const tBody = document.getElementById("groupCodeBody");
      let html = "";
      if(!list || list.length === 0){
        html = '<tr><td colspan="2" style="text-align: center;">조회된 데이터가 없습니다.</td></tr>';
        tBody.innerHTML = html;
        clearCodeDetail();
        return;
      }
      list.forEach(function (item) {
        const cdGroup = item.cdGroup || "";
        const cdGroupNm = item.cdGroupNm || "";
        html += '<tr data-cd-group="'+cdGroup+'" data-cd-group-nm="'+cdGroupNm+'">';
        html += '<td>';
        html += '<span class="cell-text">'+cdGroup+'</span>';
        html += '<input class="input cell-input input--sm" type="text" value="'+cdGroup+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+cdGroupNm+'</span>';
        html += '<input class="input cell-input input--sm" type="text" value="'+cdGroupNm+'">';
        html += '</td>';
        html += '</tr>';
      })
      tBody.innerHTML = html;

      const firstRow = tBody.querySelector("tr");
      if(firstRow){
        firstRow.classList.add("is-selected");
        const firstCdGroup = firstRow.dataset.cdGroup;

        selectCodeDetail(firstCdGroup);
      }
    }

    /**********************************************************************
     * 코드상세 => 초기화 함수
     ***********************************************************************/
    function clearCodeDetail(){
      const detailBody = document.getElementById("codeDetailBody");
      if(detailBody){
        detailBody.innerHTML ="";
      }
    }

    /**********************************************************************
     * 코드상세 => 조회 함수
     ***********************************************************************/
    function selectCodeDetail(firstCdGroup) {

      fetch(contextPath+"module/admin/selectCodeDetail", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          cdGroup: firstCdGroup
        })
      })
              .then(response => {
                if (!response.ok) {
                  openErrorModal("상세 조회 실패");
                  return;
                }
                return response.json();
              })
              .then(data => {
                console.log(">>>>>>>>>>>"+data.detailList[0])
                drawDetailList(data.detailList);
              })
              .catch(error => {
                console.error(error);
                return;
              });
    }

    /**********************************************************************
     * 코드상세 => 회 후 데이터 매핑 함수
     ***********************************************************************/
    function drawDetailList(list) {
      const tBody = document.getElementById("codeDetailBody");
      let html = "";
      if(!list || list.length === 0){
        html = '<tr class="empty-row"><td colspan="6" style="text-align: center;">조회된 데이터가 없습니다.</td></tr>';
        tBody.innerHTML = html;
        return;
      }
      list.forEach(function (item) {
        const cdGroup = item.cdGroup || "";
        const cdVal = item.cdVal || "";
        const cdNm = item.cdNm || "";
        const cdDesc = item.cdDesc || "";
        const lnupSer = item.lnupSer || "";
        const uzYn = item.uzYn || "";
        const vldStdd = item.vldStdd || "";
        const vldEndt = item.vldEndt || "";
        html += `<tr data-cd-group="${cdGroup}" data-cd-val="${cdVal}" data-new-row="N">`;
        html += '<td>';
        html += '<span class="cell-text">'+cdVal+'</span>';
        html += '<input class="input cell-input input--sm cd-val" type="text" value="'+cdVal+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+cdNm+'</span>';
        html += '<input class="input cell-input input--sm cd-nm" type="text" value="'+cdNm+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+lnupSer+'</span>';
        html += '<input class="input cell-input input--sm lnup-ser" type="text" value="'+lnupSer+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+uzYn+'</span>';
        html += '<input class="input cell-input input--sm uz-yn" type="text" value="'+uzYn+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+vldStdd+'</span>';
        html += '<input class="input cell-input input--sm vld-stdd" type="text" value="'+vldStdd+'">';
        html += '</td>';
        html += '<td>';
        html += '<span class="cell-text">'+vldEndt+'</span>';
        html += '<input class="input cell-input input--sm vld-endt" type="text" value="'+vldEndt+'">';
        html += '</td>';
        html += '</tr>';
      })
      tBody.innerHTML = html;

      const firstRow = tBody.querySelector("tr");
      if(firstRow){
        firstRow.classList.add("is-selected");
      }
    }

    /**********************************************************************
     * 코드상세 => 저장버튼 클릭 이벤트
     ***********************************************************************/
    function saveGroupCode() {
      const groupBody = document.getElementById("groupCodeBody");
      if(!groupBody){
        console.log("찾을수 없습니다.");
        return;
      }
      let groupRow = groupBody.querySelector("tr.is-selected");
      if(!groupRow){
        groupRow = groupBody.querySelector('tr[data-new-row="Y"]');
      }
      if(!groupRow){
        openInformationModal("저장할 코드그룹을 선택하세요");
        return;
      }

      const cdGroupInput = groupRow.querySelector(".cd-group");
      const cdGroupNmInput = groupRow.querySelector(".cd-group-nm");
      let cdGroup = "";
      let cdGroupNm = "";
      if(cdGroupInput){
        cdGroup = cdGroupInput.value.trim();
      }else{
        cdGroup = groupRow.dataset.cdGroup||"";
      }
      if(cdGroupNmInput){
        cdGroupNm = cdGroupNmInput.value.trim();
      }else{
        cdGroupNm = groupRow.dataset.cdGroupNm||"";
      }
      //console.log("cdGroup===>>",cdGroup)
      //console.log("cdGroupNm===>>",cdGroupNm)

      if(cdGroup === ""){
        openInformationModal("그룹 코드번호을 입력하세요.");
        cdGroupInput?.focus();
        return;
      }
      if(cdGroupNm === ""){
        openInformationModal("그룹명을 입력하세요.");
        cdGroupNmInput?.focus();
        return;
      }

      const detailList = [];
      const cdValSet = new Set();

      const datailRows = document.querySelectorAll("#codeDetailBody tr");
      for(const row of datailRows){
        const cdValEl = row.querySelector(".cd-val");
        const cdNmEl = row.querySelector(".cd-nm");
        const lnupSerEl = row.querySelector(".lnup-ser");
        const uzYnEl = row.querySelector(".uz-yn");
        const vldStddEl = row.querySelector(".vld-stdd");
        const vldEndtEl = row.querySelector(".vld-endt");

        const cdVal = cdValEl?.value?.trim() ?? "";
        const cdNm = cdNmEl?.value?.trim() ?? "";
        const lnupSer = lnupSerEl?.value?.trim() ?? "";
        const uzYn = uzYnEl?.value ?? "";
        const vldStdd = vldStddEl?.value ?? "";
        const vldEndt = vldEndtEl?.value ?? "";

        //console.log("cdVal===>>",cdVal)
        //console.log("cdNm===>>",cdNm)
        //console.log("lnupSer===>>",lnupSer)
        //console.log("vldStdd===>>",vldStdd)
        //console.log("vldEndt===>>",vldEndt)
        if(cdVal === ""){
          openInformationModal("코드번호를 입력하세요.");
          cdValEl?.focus();
          return;
        }

        if(cdValSet.has(cdVal)){
          openErrorModal("중복된 코드번호입니다.");
          cdValEl?.focus();
          return;
        }
        cdValSet.add(cdVal);

        if(cdNm === ""){
          openInformationModal("코드명을 입력하세요.");
          cdNmEl?.focus();
          return;
        }

        if(lnupSer === ""){
          openInformationModal("순서를 입력하세요.");
          lnupSerEl?.focus();
          return;
        }

        if(isNaN(lnupSer)){
          openErrorModal("순서는 숫자로 입력하세요.");
          lnupSerEl?.focus();
          return;
        }

        if(vldStdd === ""){
          openInformationModal("유효시작일을 입력하세요.");
          vldStddEl?.focus();
          return;
        }

        if(vldEndt === ""){
          openInformationModal("유효마감일을 입력하세요.");
          vldEndtEl?.focus();
          return;
        }

        if(vldStdd > vldEndt){
          openErrorModal("유효시작일은 유효마감일보다 클 수 없습니다.");
          vldStddEl?.focus();
          return;
        }

        detailList.push({
          cdVal:cdVal,
          cdNm:cdNm,
          lnupSer:lnupSer,
          uzYn:uzYn,
          vldStdd:vldStdd,
          vldEndt:vldEndt
        });
      }

      const param = {
        group : {
          cdGroup:cdGroup,
          cdGroupNm:cdGroupNm
        },
        detailList:detailList
      };
      openConfirmModal("등록 하시겠습니까?",function (){

        fetch(contextPath+"module/admin/saveGroupCode", {
          method: "POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(param)
        })
                .then(response => {
                  if (!response.ok) {
                    openErrorModal("등록 실패");
                    return;
                  }
                  return response.json();
                })
                .then(data => {
                  if(data.result === "SUCCESS"){
                    openSuccessModal("등록되었습니다.");
                    searchGropCode();
                  }else{
                    openErrorModal("등록 실패 :"+data.message);
                    return;
                  }
                })
                .catch(error => {
                  console.error(error);
                  openErrorModal("등록 중 오류가 발행했습니다.");
                  return;
                });
      });
    }

    /**********************************************************************
     * 코드상세 => 행추가 이벤트
     ***********************************************************************/
    function addDetailRow(e) {
      console.log("상세 행추가");

      if(e){
        e.preventDefault();
        e.stopPropagation();
      }

      const tBody = document.getElementById("codeDetailBody");
      //코드그룹 선택행
      const groupBody = document.getElementById("groupCodeBody");
      const groupRow = groupBody.querySelector("tr.is-selected");
      if(!groupRow){
        openErrorModal("코드그룹을 먼저 선택하세요.");
        return;
      }

      // 기존 상세 선택 해제
      tBody.querySelectorAll("tr").forEach(function (row) {
        row.classList.remove("is-selected");
      });
      const emptyRow = tBody.querySelector(".empty-row");
      if(emptyRow){
        emptyRow.remove();
      }

      const tr = document.createElement("tr");
      // 신규행 표시용
      tr.dataset.newRow = "Y";
      tr.classList.add("is-editing");
      tr.classList.add("is-selected");
      tr.innerHTML += '<td>' +
              '<span class="cell-text" style="display:none"></span>'+
              '<input class="input cell-input input--sm cd-val"  type="text" value="" placeholder="코드번호">'+
              '</td>'+
              '<td>'+
              '<span class="cell-text" style="display:none"></span>'+
              '<input class="input cell-input input--sm cd-nm" type="text" value="" placeholder="코드명">'+
              '</td>'+
              '<td>'+
              '<span class="cell-text" style="display:none"></span>'+
              '<input class="input cell-input input--sm lnup-ser" type="text" value="" placeholder="순서">'+
              '</td>'+
              '<td>'+
              '<span class="cell-text" style="display:none"></span>'+
              '<select class="input cell-input input--sm uz-yn">' +
              '<option value="Y">Y</option>'+
              '<option value="N">N</option>'+
              '</select>'+
              '</td>'+
              '<td>'+
              '<span class="cell-text" style="display:none"></span>'+
              '<input class="input cell-input input--sm vld-stdd" type="date" value="" placeholder="유효시작일">'+
              '</td>'+
              '<td>'+
              '<span class="cell-text" style="display:none"></span>'+
              '<input class="input cell-input input--sm vld-endt" type="date" value="9999-12-31" placeholder="유효마감일">'+
              '</td>';

      tBody.appendChild(tr);

      tr.querySelectorAll(".call-input").forEach(function (el) {
        el.style.display = "";
        el.disabled = false;
        el.readOnly = false;
      })

      const cdValInput = tr.querySelector(".cd-val");
      if(cdValInput){
        cdValInput.focus();
      }
    }

  </script>
</head>
<body>


    <main class="content">

      <!-- 페이지 헤더 — get_design_context(617:10047) 실측. "Btn" 슬롯(617:10049)이 빈 채로
           실측돼 버튼 없이 제목만 반영했다. -->
      <div class="page-header">
        <h1 class="page-header__title">코드관리</h1>
      </div>

      <div class="layout-list">

        <!-- 검색영역 — get_design_context(617:10554) 실측.
             2026-08-20: 새로고침/조회 버튼을 .search-area__row 바깥의 별도 .search-area__actions로
             두던 구조를, 관리자>감사로그(audit-log.html)와 동일하게 마지막 .search-area__item의
             .search-area__combo 안으로 옮겼다 — 필터 줄바꿈 시에도 버튼이 그 항목 옆에 붙어
             있도록 하는 감사로그 패턴 재사용. -->
        <form class="search-area">
          <div class="search-area__row">
            <div class="search-area__item">
              <label class="search-area__label" for="code-no">코드 그룹</label>
              <div class="search-area__combo">
                <input id="code-no" class="input input--w120" type="text" placeholder="코드번호">
                <input id="code-name" class="input input--w120" type="text" placeholder="코드명">
                <div class="search-area__actions">
                  <button type="button" class="btn-icon" id="btnRefresh" onclick="searchRefresh()">
                    <img th:src="@{/images/icons/buttons/ic-16-refresh.svg}" alt="">
                  </button>
                  <button th:each="btn : ${session.buttonList}"
                          th:if="${btn.menuId == param.menuId[0] and btn.areaCd == 'SEARCH'}"
                          type="button"
                          class="btn-outline-primary"
                          style="width:80px"
                          th:id="${btn.btnCd}"
                          data-audit="Y"
                          th:data-area-cd="${btn.areaCd}"
                          th:data-menu-id="${btn.menuId}"
                          th:data-btn-cd="${btn.btnCd}"
                          th:data-action-cd="${btn.actionCd}"
                          th:data-action-nm="${btn.btnNm}">
                    <span class="btn-icon-slot"><svg width="11.5" height="11.5" viewBox="0 0 11.5 11.5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span th:text="${btn.btnNm}"></span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>

        <!-- 코드그룹 목록(좌) + 코드값 목록(우) — get_design_context(617:10628) 실측.
             Figma 원본 제목이 두 곳 다 "서식조회 목록"으로 돼 있었으나(다른 화면 템플릿을
             복사하면서 라벨을 못 고친 것으로 보이는 오류) 사용자 확인 후 "코드 그룹"/"코드 상세"로
             교체했다(2026-08-19). -->
        <div style="display:flex; gap:24px; align-items:flex-start; width:100%">

          <!-- 좌측: 코드그룹 목록 — get_design_context(617:10083) 실측 기반.
               [TEST-ONLY, 2026-08-19] 사용자 요청으로 이 페이지에서만 실험 중 — 패널
               자체의 폭도 px min/max 클램프 대신 %로 바꿨다. 비율은 직전에 실측했던
               "좌측 max 460px : 우측 min 740px" (460+740=1200 기준) 를 그대로 옮긴 것
               (460/1200=38.33%, 740/1200=61.67%) — 화면 폭이 바뀌어도 두 패널이 항상 이
               비율을 유지한 채 같이 늘고 준다. 24px 갭을 calc()로 양쪽에서 절반(12px)씩
               미리 빼서, 두 패널 %의 합(100%)+갭이 컨테이너 폭을 넘지 않게 했다. 표는
               이미 width:100%라 패널 폭이 바뀌면 그대로 따라간다(풀로 채움). 표 내부 칼럼
               비율(colgroup %)은 이전 실측 그대로 유지 — 패널이 늘고 줄 때 칼럼도 항상
               같은 비율로 같이 늘고 준다.
               2026-08-20: 사용자가 상호작용을 명확히 함 — 이 표는 "한 번 클릭 = 행 선택
               (오른쪽 코드상세 패널 연동, is-selected)", "더블클릭 = 편집(코드번호·코드명
               둘 다 input으로 전환)"이 별개 동작이다. 두 동작 모두 js/table-row-edit.js
               한 파일 안에 있다(선택은 data-row-select, 편집 트리거 오버라이드는
               data-edit-trigger="dblclick") — 처음엔 선택 로직을 별도 파일(table-row-select.js)로
               만들었다가, "행 클릭 시 클래스 하나만 토글"이라는 동일한 뼈대를 쓰는 로직을
               파일만 나누는 건 불필요한 중복이라는 지적을 받아 이 파일로 합쳤다. 같은 표에서
               서로 다른 이벤트(click vs dblclick)만 듣기 때문에 두 동작이 충돌하지 않는다. -->
          <div class="task-section" style="flex:0 0 calc(38.33% - 12px)">
            <div class="task-section__header">
              <span class="task-section__title">코드 그룹</span>
              <div class="task-section__actions">
                <button th:each="btn : ${session.buttonList}"
                        th:if="${btn.menuId == param.menuId[0] and btn.areaCd == 'HEADER'}"
                        type="button"
                        class="btn-neutral"
                        style="width:80px"
                        th:id="${btn.btnCd}"
                        data-audit="Y"
                        th:data-area-cd="${btn.areaCd}"
                        th:data-menu-id="${btn.menuId}"
                        th:data-btn-cd="${btn.btnCd}"
                        th:data-action-cd="${btn.actionCd}"
                        th:data-action-nm="${btn.btnNm}">
                  <img th:src="@{${btn.iocnUrl}}" alt="">
                  <span th:text="${btn.btnNm}"></span>
                </button>
              </div>
            </div>
            <table class="table" style="table-layout:fixed; width:100%" data-row-select data-edit-trigger="dblclick">
              <colgroup>
                <col style="width:30.43%">
                <col style="width:69.57%">
              </colgroup>
              <thead>
                <tr>
                  <th>코드번호</th>
                  <th>코드명</th>
                </tr>
              </thead>
              <tbody id="groupCodeBody">
              </tbody>
            </table>
          </div>

          <!-- 우측: 코드값 목록 — get_design_context(617:10872) 재실측(2026-08-20,
               "신청부서"/"최종변경일자" → "유효시작일"/"유효마감일"로 라벨 교체. 두 칼럼 다
               날짜값이라 지금까지의 "부서명인데 날짜가 들어있는 오류"가 아니라 원래부터
               유효기간 칼럼이었던 것으로 확인됐다 — 이전 코멘트의 "Figma 원본 오류" 추정은
               철회한다. "유효마감일"도 이번에 Figma에서 새로 datepicker(ic/24/insert_invitation)로
               바뀌어 유효시작일과 동일하게 cell-text/cell-input(type=date) 쌍을 갖는다.
               코드번호는 항상 텍스트(고유 식별자라 미편집), 나머지 5칼럼은 전 행에
               cell-text/cell-input을 둬서 어떤 행이든 편집 가능하게 했다(이전엔 첫 행만
               가능했는데, 사용자가 "더블클릭하면 셀이 활성화"라고 확인해줘 특정 행 하나로
               고정할 이유가 없어짐). 편집 트리거는 table-row-edit.js 기본값인 click이 아니라
               data-edit-trigger="dblclick"로 오버라이드했다 — 이 표가 속한 화면은 좌측
               코드그룹 표에서 "한 번 클릭 = 행 선택(코드상세 연동)"을 이미 쓰고 있어, 오른쪽도
               같은 규칙(클릭=선택/포커스, 더블클릭=편집)으로 통일했다. -->
          <div class="task-section" style="flex:0 0 calc(61.67% - 12px)">
            <div class="task-section__header">
              <span class="task-section__title">코드 상세</span>
              <div class="task-section__actions">
                <button th:each="btn : ${session.buttonList}"
                        th:if="${btn.menuId == param.menuId[0] and btn.areaCd == 'DETAIL'}"
                        type="button"
                        class="btn-neutral"
                        style="width:80px"
                        th:id="${btn.btnCd}"
                        data-audit="Y"
                        th:data-area-cd="${btn.areaCd}"
                        th:data-menu-id="${btn.menuId}"
                        th:data-btn-cd="${btn.btnCd}"
                        th:data-action-cd="${btn.actionCd}"
                        th:data-action-nm="${btn.btnNm}">
                  <img th:src="@{${btn.iocnUrl}}" alt="">
                  <span th:text="${btn.btnNm}"></span>
                </button>

              </div>
            </div>
            <table class="table" style="table-layout:fixed; width:100%" data-edit-trigger="dblclick">
              <colgroup>
                <col style="width:14.58%">
                <col style="width:20.83%">
                <col style="width:12.5%">
                <col style="width:10.42%">
                <col style="width:20.83%">
                <col style="width:20.84%">
              </colgroup>
              <thead>
                <tr>
                  <th>코드번호</th>
                  <th>코드명</th>
                  <th>순서</th>
                  <th>사용여부</th>
                  <th>유효시작일</th>
                  <th>유효마감일</th>
                </tr>
              </thead>
              <tbody id="codeDetailBody">
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </main>

<div th:replace="~{common/commonModals :: commonModals}"></div>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/lnb.js}"></script>
<script th:src="@{/js/date-input.js}"></script>
<script th:src="@{/js/table-row-edit.js}"></script>

<script th:src="@{/js/table-col-select-all.js}"></script>
<script th:src="@{/js/table-row-link.js}"></script>
<script th:src="@{/js/table-sort-toggle.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
