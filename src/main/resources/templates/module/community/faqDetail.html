<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
  <meta charset="UTF-8">
  <title>FAQ 상세 | AI OCR 서류판독시스템</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">

  <!-- inline JS 영역-->
  <script th:inline="javascript" type="text/javascript">
    document.addEventListener('DOMContentLoaded',function () {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      const menuId = params.get("menuId");

      /**********************************************************************
       *  화면내 모든 버튼 클릭 이벤트
       ***********************************************************************/
      document.addEventListener("click",function (e) {
        const btn = e.target.closest("[data-action-cd]");

        if(!btn){ return;}

        const actionCd = btn.dataset.actionCd;

        switch (actionCd){
          case "DELETE":
            deleteDetailNotice();
            break;
          case "UPDATE":
            updateDetailNotice();
            break;
          case "LIST":
            location.href = contextPath+"module/community/faq"+"?menuId="+encodeURIComponent(menuId||"");
            break;
        }
      })
    });

    /**********************************************************************
     *  삭제 버튼 함수
     ***********************************************************************/
    function deleteDetailNotice() {
      const noticeSeqnoEl = document.getElementById("noticeSeqno");
      const noticeTypeCdEl = document.getElementById("noticeTypeCd");
      if(!noticeSeqnoEl){
        openErrorModal("삭제할 계시물 번호를 찾을 수 없습니다.");
        return;
      }
      const noticeSeqno = Number(noticeSeqnoEl.value);
      const noticeTypeCd = noticeTypeCdEl.value;
      if(!noticeSeqno){
        openErrorModal("삭제할 계시물 번호가 없습니다.");
        return;
      }
      const seqList = [{
        noticeSeqno : noticeSeqno,
        noticeTypeCd :noticeTypeCd
      }];

      openConfirmModal("삭제 하시겠습니까?",function (){

        fetch(contextPath+"module/community/deleteNotice", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(seqList)
        })
                .then(response => {
                  if (!response.ok) {
                    openErrorModal("삭제 요청 실패");
                    return;
                  }
                  return response.json();
                })
                .then(data => {
                  if(data.result > 0){
                    openSuccessModal("삭제 되었습니다.");
                    const params = new URLSearchParams(window.location.search);
                    const menuId = params.get("menuId");
                    location.href = contextPath+"module/community/faq"+"?menuId="+encodeURIComponent(menuId||"");
                  }else{
                    openErrorModal("삭제된 데이터가 없습니다.");
                    return;
                  }
                })
                .catch(error => {
                  console.error(error);
                  openErrorModal("삭제 중 오류가 발행했습니다.");
                  return;
                });
      });

    }

    /**********************************************************************
     *  수정 버튼 이벤트
     ***********************************************************************/
    function updateDetailNotice() {
      console.log("수정버튼 클릭 이벤트 ");
      const formData = new FormData();
      // 공지사항 데이터
      formData.append("noticeSeqno",document.getElementById("noticeSeqno").value.trim());
      formData.append("noticeTtl",document.getElementById("noticeTtl").value.trim());
      formData.append("noticeCn",document.getElementById("noticeCn").value.trim());
      formData.append("faqAnsmer",document.getElementById("faqAnsmer").value.trim());
      formData.append("stdd",document.getElementById("stdd").value.trim());
      formData.append("endt",document.getElementById("endt").value.trim());
      formData.append("noticeTypeCd",document.getElementById("noticeTypeCd").value.trim());
      formData.append("files","");


      const noticeTtl = document.getElementById("noticeTtl");
      // 체크
      if(!noticeTtl || !noticeTtl.value.trim()){
        openInformationModal("제목을 입력하세요.");
        noticeTtl.focus();
        return;
      }
      const faqAnsmer = document.getElementById("faqAnsmer");
      if(!faqAnsmer || !faqAnsmer.value.trim()){
        openInformationModal("답변 내용을 입력하세요.");
        faqAnsmer.focus();
        return;
      }
      openConfirmModal("수정 하시겠습니까?",function (){

        fetch(contextPath+"module/community/updateDetailNotice", {
          method: "POST",
          body: formData
        })
                .then(response => {
                  if (!response.ok) {
                    openErrorModal("수정 요청 실패");
                    return;
                  }
                  return response.json();
                })
                .then(data => {
                  if(data.result === "SUCCESS"){
                    openSuccessModal("수정 되었습니다.");
                    const params = new URLSearchParams(window.location.search);
                    const menuId = params.get("menuId");
                    location.href = contextPath+"module/community/faq"+"?menuId="+encodeURIComponent(menuId||"");

                  }else{
                    openErrorModal("수정 실패"+data.message);
                    return;
                  }
                })
                .catch(error => {
                  console.error(error);
                  openErrorModal("수정 중 오류가 발행했습니다.");
                  return;
                });
      });
    }



  </script>
</head>
<body>


    <main class="content content--narrow">

      <div class="page-header">
        <h1 class="page-header__title">FAQ 상세</h1>
        <div class="page-header__actions">
          <button th:each="btn : ${session.buttonList}"
                  th:if="${btn.menuId == param.menuId[0] and btn.areaCd == 'DETAIL'}"
                  type="button"
                  th:class="${btn.actionCd == 'UPDATE'} ? 'btn btn-primary' : 'btn-outline-primary'"
                  style="width:80px"
                  th:id="${btn.btnCd}"
                  data-audit="Y"
                  th:data-area-cd="${btn.areaCd}"
                  th:data-menu-id="${btn.menuId}"
                  th:data-btn-cd="${btn.btnCd}"
                  th:data-action-cd="${btn.actionCd}"
                  th:data-action-nm="${btn.btnNm}">
            <span th:text="${btn.btnNm}"></span></button>
        </div>
      </div>

      <div class="notice-detail">

        <!-- 기본정보 — get_design_context(775:3120) 실측 -->
        <div class="notice-detail__section">
          <div class="detail-panel detail-panel--column">
            <div class="search-area__row search-area__row--detail">
              <div class="search-area__item search-area__item--equal">
                <span class="search-area__label" style="width:80px; flex-shrink:0">제목</span>
                <input type="hidden" id="noticeSeqno" name="noticeSeqno" th:value="${detail['noticeSeqno']}">
                <input type="hidden" id="noticeTypeCd" name="noticeTypeCd" th:value="${detail['noticeTypeCd']}">
                <input type="hidden" id="endt" name="endt" th:value="${detail['endt']}">
                <input class="input" type="text" style="flex:1" placeholder="제목을 입력해주세요" th:value="${detail['noticeTtl']}" id="noticeTtl">
              </div>
              <div class="search-area__item search-area__item--equal">
                <span class="search-area__label" style="width:80px; flex-shrink:0">작성자</span>
                <span class="notice-detail__value" th:text="${' ('+detail['lastChngEmpno']+')'}"></span>
              </div>
            </div>
            <div class="search-area__item search-area__item--equal">
              <span class="search-area__label" style="width:80px; flex-shrink:0">작성일자</span>
              <div class="notice-register__schedule">
                <input class="input input--w120" type="date" id="stdd" th:value="${detail['stdd']}" th:readonly="true">
              </div>
            </div>
          </div>
        </div>

        <div class="faq-register">
          <div class="faq-reqister__row">
            <div class="faq-register__label">
              질문
            </div>
            <div class="faq-register__content">
              <textarea id="noticeCn" name="noticeCn" class="faq-register__textarea" placeholder="질문 내용을 입력해주세요" th:text="${detail['noticeCn']}" th:readonly="true"></textarea>
            </div>
          </div>
          <div class="faq-reqister__row faq-reqister__row--answer">
            <div class="faq-register__label required">
              답변
            </div>
            <div class="faq-register__content">
              <textarea id="faqAnsmer" name="faqAnsmer" class="faq-register__textarea faq-register__textarea--answer" placeholder="답변 내용을 입력해주세요" th:text="${detail['faqAnsmer']}"></textarea>
            </div>
          </div>
        </div>

      </div>

    </main>


<div th:replace="~{common/commonModals :: commonModals}"></div>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
