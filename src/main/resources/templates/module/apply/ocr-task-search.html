<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
  <meta charset="UTF-8">
  <title>OCR업무조회 | AI OCR 서류판독시스템</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="svg_search" viewBox="0 0 11.5 11.5">
        <path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_first" viewBox="0 0 9.5 8.16667" >
        <path d="M8.75 7.41667L5.41667 4.08333L8.75 0.75M4.08333 7.41667L0.75 4.08333L4.08333 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_prev" viewBox="0 0 5.5 9.5">
        <path d="M4.75 8.75L0.75 4.75L4.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_next" viewBox="0 0 5.5 9.5" >
        <path d="M0.75 8.75L4.75 4.75L0.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_last" viewBox="0 0 9.5 8.16667">
        <path d="M0.75 7.41667L4.08333 4.08333L0.75 0.75M5.41667 7.41667L8.75 4.08333L5.41667 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
</svg>
<div class="app-shell">
    <div class="app-container">
        <main class="content">
            <div class="page-header">
                <h1 class="page-header__title">OCR업무조회</h1>
                <div class="page-header__actions">
                   <button type="button" class="btn-outline-primary" id="btn_excel">엑셀다운</button>
                   <button type="button" class="btn btn-primary" id="btn_move_apply">신규 OCR서식 신청</button>
               </div>
            </div>

            <div class="tab-panel">
                <div class="layout-list">
                    <!-- 검색 필터 — get_design_context(234:1152) 실측 -->
                    <form name="form" id="form" class="search-area">
                        <input type="hidden" id="page_no" name="page_no" value="1" />
                        <input type="hidden" id="page_size" name="page_size" value="15" />
                        <div class="search-area__row">
                            <div class="search-area__item">
                                <label class="search-area__label" for="prgs_st_cd">진행상태</label>
                                <select id="prgs_st_cd" name="prgs_st_cd" class="input input--w120">
                                    <option value="">전체</option>
                                    <option th:each="prgsStCd : ${prgsStCds}"
                                                    th:value="${prgsStCd.value}"
                                                    th:text="${prgsStCd.name}"/>
                                </select>
                            </div>
                            <div class="search-area__item">
                                <label class="search-area__label" for="bzwk_cd">업무분류</label>
                                <select id="bzwk_cd" name="bzwk_cd" class="input input--w120">
                                    <option value="">전체</option>
                                    <option th:each="bzwkCd : ${bzwkCds}" 
                                                    th:value="${bzwkCd.value}"
                                                    th:text="${bzwkCd.name}"/>
                                </select>
                            </div>
                            <div class="search-area__item">
                                <label class="search-area__label" for="br_nm">신청부서</label>
                                <input id="br_nm" name="br_nm" class="input input--w200" type="text" placeholder="신청부서 입력">
                            </div>
                            <div class="search-area__item">
                                <label class="search-area__label" for="from_dt">신청일자</label>
                                <div class="search-area__combo">
                                    <input id="from_dt" name="from_dt" class="input input--w120" type="date" value="">
                                    <span class="search-area__tilde">~</span>
                                    <input id="to_dt" name="to_dt" class="input input--w120" type="date" value="">
                                </div>
                            </div>
                            <div class="search-area__item">
                                <label class="search-area__label" for="keyword">검색어</label>
                                <div class="search-area__combo">
                                    <select id="gubun" name="gubun" class="input input--w120">
                                        <option value="0">선택</option>
                                        <option value="1">업무명</option>
                                        <option value="2">업무내용</option>
                                    </select>
                                    <input id="keyword" name="keyword" class="input input--w200" type="text" value="">
                                </div>
                            </div>
                        </div>
                        <div class="search-area__actions">
                            <button type="button" class="btn-icon">
                                <img th:src="@{/images/icons/buttons/ic-16-refresh.svg}" alt="새로고침">
                            </button>
                            <button type="button" class="btn-outline-primary" id="btn_submit">
                                <span class="btn-icon-slot">
                                    <svg width="11.5" height="11.5" fill="none" aria-hidden="true">
                                        <use href="#svg_search" />
                                    </svg>
                                </span>
                                조회
                            </button>
                        </div>
                    </form>

                    <!-- 목록 — get_design_context(237:1900, 232:1064, 254:2239) 실측 -->
                    <div class="list-section">
                        <h2 class="list-section__title">서식조회 목록</h2>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th style="width:60px">No</th>
                                    <th style="width:10%">진행상태</th>
                                    <th style="width:7%">업무분류</th>
                                    <th>업무명</th>
                                    <th style="width:7%">신청자</th>
                                    <th style="width:7%">신청부서</th>
                                    <th style="width:10%">신청일자</th>
                                    <th style="width:10%">최종변경일자</th>
                                </tr>
                            </thead>
                            <!-- img/신청조회.png 실측 반영. 일부 셀은 원본 이미지 해상도가 낮아 판독이 불확실함
                                — 하단 안내 참고(신청부서 "매월동지점"/"해남지점", 서식명 "수시입출금신청서") -->
                            <tbody id="id_task_list">
                            </tbody>
                        </table>

                        <div class="list-footer">
                            <span class="list-footer__count"></span>
                            <nav class="pagination">
                                
                            </nav>
                            <select id="page-size" class="input input--w140 list-footer__page-size">
                                <option value="15">15개씩 보기</option>
                                <option value="30">30개씩 보기</option>
                                <option value="50">50개씩 보기</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:inline="javascript" type="text/javascript">
    $(() => {
        $("#btn_submit").on("click", function(){
        	fnSearch();
        });

        $("#btn_excel").on("click", function(){
            fnExcel();
        });

        $("#btn_move_apply").on("click", function(){
            location.href = contextPath + "module/apply/ocrTaskApply?menuId=MENU0304";
        });

        fnSearch();

        movePrev = function(){
            let pageNo = Number($("#page_no").val());
            $("#page_no").val(pageNo - 1 );
            fnSearch();
        }

        movePage = function(pageNo){
            $("#page_no").val(pageNo);
            fnSearch();
        }

        moveNext = function(){
            let pageNo = Number($("#page_no").val());
            $("#page_no").val(pageNo + 1 );
            fnSearch();
        }
    });

    function fnSearch(){
        let param = {
            bzwk_cd: $("#bzwk_cd").val(),
            prgs_st_cd: $("#prgs_st_cd").val(),
            br_nm: $("#br_nm").val(),
            from_dt: $("#from_dt").val() == undefined ? "" : $("#from_dt").val(),
            to_dt: $("#to_dt").val() == undefined ? "" : $("#to_dt").val(),
            gubun: Number($("#gubun").val()),
            keyword: $("#keyword").val(),
            page_no: $("#page_no").val() == "" ? 1 : Number($("#page_no").val()),
            page_size: $("#page_size").val() == "" ? 15 : Number($("#page_size").val())
        };
        
        console.log("form => ", $("#form").serialize());

        fetch(contextPath + 'api/v1/task/list', {
            method: "POST",
            headers: {
                "content-Type": "application/json"
            },
            body: JSON.stringify(param)
        })
        .then(response => response.json())
        .then(res => {
            if(res.status == 200) {
                console.log(res.data);
                fnDisplayList(res.data.data);
                fnSettingPage(res.data.page);
            }
            else{
                alert(res.message + "[" + res.status + "]");
            }
        })
        .catch(error => {
            console.error('실패', error);
            alert("오류가 발생했습니다.")
        });
    }
    
    function fnExcel(){
        let param = {
            bzwk_cd: $("#bzwk_cd").val(),
            prgs_st_cd: $("#prgs_st_cd").val(),
            br_nm: $("#br_nm").val(),
            from_dt: $("#from_dt").val() == undefined ? "" : $("#from_dt").val(),
            to_dt: $("#to_dt").val() == undefined ? "" : $("#to_dt").val(),
            gubun: Number($("#gubun").val()),
            keyword: $("#keyword").val(),
            page_no: $("#page_no").val() == "" ? 1 : Number($("#page_no").val()),
            page_size: $("#page_size").val() == "" ? 15 : Number($("#page_size").val())
        };
        
        console.log("form => ", $("#form").serialize());

        fetch(contextPath + 'api/v1/task/excel', {
            method: "POST",
            headers: {
                "content-Type": "application/json"
            },
            body: JSON.stringify(param)
        })
        .then(response => response.json())
        .then(res => {
            if(res.status == 200) {
                console.log(res.data);
            }
            else{
                alert(res.message + "[" + res.status + "]");
            }
        })
        .catch(error => {
            console.error('실패', error);
            alert("오류가 발생했습니다.")
        });
    }
    
    function fnDisplayList(list){
    	$("#id_task_list").empty();
    	
        if(list.length == 0){
            let html = `
                <tr>
                    <td colspan="8">조회된 데이터가 없습니다.</td>
                </tr>
            `;
        	$("#id_task_list").append(html);
        }
        else{
            list.forEach(function(item, index){
                let html = `
                	<tr>
                    <td>${item.idx}</td>
                    <td>${item.prgsStNm}</td>
                    <td>${item.bzwkNm}</td>
                    <td>${item.wkflowNm}</td>
                    <td>${item.regNm}</td>
                    <td>${item.brNm}</td>
                    <td>${item.regDt}</td>
                    <td>${item.modDt}</td>
                </tr>
                `;
                $("#id_task_list").append(html);
            });
        }
    }
    
    function fnSettingPage(page){
        //  조회 결과 영역
    	$(".list-footer__count").empty();
    	let html = `
    		조회 결과 : <strong>${page.startRowIndex}-${page.endRowIndex}</strong>/${page.totalRecord}	   
    	`;
        $(".list-footer__count").append(html);
        
        //  페이지 영역
        $(".pagination").empty();
        
        html = ``;
        if(page.hasFirstPageNav){
            html += `
                <button type="button" class="pagination__item" aria-label="처음" onclick="movePage(${page.firstPageNo});">
                    <svg width="9.5" height="8.16667" fill="none" aria-hidden="true">
                        <use href="#svg_move_first" />
                    </svg>
                </button>
            `;
        }
        
        if(page.hasPrevPageNav){
        	html += `
                <button type="button" class="pagination__item" aria-label="이전" onclick="movePrev();">
                    <svg width="5.5" height="9.5" fill="none" aria-hidden="true">
                        <use href="#svg_move_prev" />
                    </svg>
                </button>
            `;
        }
        
        for(let i=page.firstPageNo ; i<=page.lastPageNo ; i++){
            html += `
                <span>
                    <button type="button" class="pagination__item is-current" onclick="movePage(${i});">${i}</button>
                </span>
            `;
        }

        if(page.hasNextPageNav){
        	html += `
        	    <button type="button" class="pagination__item" aria-label="다음" onclick="moveNext();">
                    <svg width="5.5" height="9.5" fill="none" aria-hidden="true">
                        <use href="#svg_move_next" />
                    </svg>
                </button>
            `;
        }
        
        if(page.hasLastPageNav){
        	html += `
                <button type="button" class="pagination__item" aria-label="끝" onclick="movePage(${page.lastPageNo});">
                    <svg width="9.5" height="8.16667" fill="none" aria-hidden="true">
                        <use href="#svg_move_last" />
                    </svg>
                </button>
        	`;
        }
        
        $(".pagination").append(html);
    }
    
</script>
<script th:src="@{/js/lnb.js}"></script>
</body>
</html>
