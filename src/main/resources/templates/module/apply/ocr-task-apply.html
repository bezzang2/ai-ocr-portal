<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
<meta charset="UTF-8">
<title>OCR업무신청 | AI OCR 서류판독시스템</title>
<link rel="stylesheet" th:href="@{/css/main.css}">
<!-- inline CSS 영역-->
<style th:inline="css" type="text/css">

</style>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/lnb.js}"></script>
<script th:src="@{/js/toggle-group.js}"></script>
<body>

        <path d="M9.13449 3.72478C8.67096 3.25973 8.12006 2.8909 7.51348 2.6395C6.9069 2.3881 6.25661 2.2591 5.6 2.25991C4.27397 2.26007 3.0023 2.78691 2.06465 3.72456C1.12701 4.6622 0.600167 5.93387 0.6 7.25991C0.600166 8.58652 1.1268 9.85884 2.06427 10.7975C3.00173 11.7361 4.27339 12.2644 5.6 12.2662C6.92672 12.2644 8.19847 11.736 9.13596 10.7973C10.0734 9.85848 10.6 8.586 10.6 7.25927" stroke="currentColor" stroke-width="1.2" stroke-miterlimit="10" stroke-linecap="round"/><path d="M8.67728 0.60014L9.27635 3.03298C9.32952 3.24863 9.29498 3.47656 9.18031 3.66678C9.06563 3.85699 8.88019 3.99395 8.66467 4.04761L6.22489 4.64542" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <symbol id="svg_rule_add" viewBox="0 0 10.6667 10.6667">

    <symbol id="svg_rule_del" viewBox="0 0 11.2 12.3111">

    </symbol>
    <symbol id="svg_attach_upload" viewBox="0 0 12 12">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M9.83263 3.64645C10.0558 3.84171 10.0558 4.15829 9.83263 4.35355L5.2612 8.35355C5.03805 8.54882 4.67624 8.54882 4.45308 8.35355L2.16737 6.35355C1.94421 6.15829 1.94421 5.84171 2.16737 5.64645C2.39052 5.45118 2.75233 5.45118 2.97549 5.64645L4.85714 7.29289L9.02451 3.64645C9.24767 3.45118 9.60948 3.45118 9.83263 3.64645Z" fill="currentColor"/>
    </symbol>
    <symbol id="svg_checkbox" viewBox="0 0 12 12">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M9.83263 3.64645C10.0558 3.84171 10.0558 4.15829 9.83263 4.35355L5.2612 8.35355C5.03805 8.54882 4.67624 8.54882 4.45308 8.35355L2.16737 6.35355C1.94421 6.15829 1.94421 5.84171 2.16737 5.64645C2.39052 5.45118 2.75233 5.45118 2.97549 5.64645L4.85714 7.29289L9.02451 3.64645C9.24767 3.45118 9.60948 3.45118 9.83263 3.64645Z" fill="currentColor"/>

    <symbol id="svg_modal_close" viewBox="0 0 7.725 7.725">

        <path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

        <path d="M8.6 0.6L3.1 6.1L0.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

            <path d="M0.666667 0.666667L4 4L7.33333 0.666667" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>

<div class="app-shell">
    <div class="app-container">
        <main class="content">
            <!-- 페이지 헤더 — get_design_context(493:12281) 실측. 버튼 구성은 OCR서식신청 추출화면과 동일 -->
            <div class="page-header">
                <h1 class="page-header__title">OCR 업무신청</h1>
                <div class="page-header__actions">
                    <button type="button" class="btn-outline-primary btn-outline-primary--square" aria-label="새로고침" onclick="fnRefresh();">
                        <span class="btn-icon-slot">
                            <svg fill="none" aria-hidden="true">
                                <use href="#svg_refresh" />
                            </svg>
                        </span>
                    </button>
                    <button type="button" class="btn-outline-primary" style="width:70px" onclick="fnSaveTemp();">임시저장</button>
                    <!-- TODO: 신청취소가 가능한지 확인 후 버튼 open 및 기능 구현 
                    <button type="button" class="btn-outline-primary" style="width:70px">신청취소</button>
                     -->
                    <button type="button" class="btn btn-primary" style="width:70px" onclick="fnSubmit();">신청</button>
                </div>
            </div>
    
            <!-- 검색영역+본문을 한 컨테이너로 묶어 .content의 gap이 둘 사이에 끼지 않게 한다 —
            OCR서식신청 추출화면과 동일한 "검색+분할뷰" 패턴이라 .split-view/.split-view__search/.split-view__body를 그대로 재사용 -->
            <div class="split-view">
                <!-- 검색영역 — get_design_context(493:12281) 실측(업무명/신청자/업무분류/담당자) -->
                <form class="split-view__search">
                    <div class="split-view__search-item">
                        <span class="split-view__search-label">업무명</span>
                        <input class="input" style="width:200px" type="text" id="bzwk_nm" name="bzwk_nm" value="" placeholder="업무명을 입력하세요.">
                    </div>
                    <div class="split-view__search-item">
                        <span class="split-view__search-label">신청자</span>
                        <input class="input" style="width:200px" type="text" th:value="${session.ssoLoginUser.userName +' ('+ session.ssoLoginUser.userId+')'}" readonly>
                    </div>
                    <div class="split-view__search-item split-view__search-item--tight">
                        <span class="split-view__search-label">업무분류</span>
                        <select class="input" id="bzwk_cd" name="bzwk_cd" style="width:120px">
                            <option th:each="item: ${data.bzwkCds}" th:value="${item.value}" th:text="${item.name}"></option>
                        </select>
                    </div>
                    <div class="split-view__search-item">
                        <span class="split-view__search-label">화면번호</span>
                        <input class="input" style="width:100px" type="text" id="scn_no" name="scn_no" value="" placeholder="화면번호" />
                    </div>
                    <div class="split-view__search-item">
                        <span class="split-view__search-label">결재선</span>
                        <div class="split-view__search-combo">
                            <button type="button" class="btn-neutral" style="width:91px" id="id_appr_modal">
                                <img th:src="@{/images/icons/buttons/ic-16-flow.svg}" alt="">
                                직원선택
                            </button>
                            <input class="input" style="width:200px" type="text" id="approval_chain" name="approval_chain" value="" readonly>
                        </div>
                    </div>
                </form>
    
                <!-- 본문 — get_design_context(493:12281) 실측(서식목록/적용서식/Rule 목록/Rule 상세/기안작성/첨부파일) -->
                <div class="split-view__body">
                    <!-- 서식목록 -->
                    <!-- 서식명/업무명 토글 + 서식목록/업무목록 — get_design_context(851:4626, 853:5137) 실측.
                        js/toggle-group.js가 .task-list__toggle 버튼 클릭에 맞춰 아래 두 패널을
                        보이기/숨기기한다(패널은 토글과 같은 부모 .task-list 밑 형제여야 한다). -->
                    <nav class="task-list">
                        <div class="task-list__toggle" data-toggle-group>
                            <button type="button" class="task-list__toggle-btn is-active" data-toggle="form">서식명</button>
                            <button type="button" class="task-list__toggle-btn" data-toggle="task">업무명</button>
                        </div>
                        <!-- 서식명 선택 시 — 기존 서식목록 -->
                        <div class="task-list__panel" data-toggle-panel="form">
                            <div class="task-list__header ">
                                서식목록 : &nbsp;&nbsp;
                                <input class="input input--w120" type="text" placeholder="서식명" id="form_keyword" name="form_keyword" value="">&nbsp;&nbsp;
                                <button type="button" class="task-list__item-add" id="btn_form_search">
                                    <span class="btn-icon-slot">
                                        <svg width="8" height="8" fill="none" aria-hidden="true">
                                            <use href="#svg_search" />
                                        </svg>
                                    </span>
                                    검색
                                </button>
                            </div>
                            <div class="task-list__body">
                                <div class="task-list__items" id="form_list">
                                    
                                </div>
                            </div>
                        </div>
    
                        <!-- 업무명 선택 시 — 업무목록. 각 항목 이름(건수)은 hover 시 semibold로 굵어져
                            클릭 가능함을 알려준다 — 실제 화면에서는 그 업무에 속한 서식 목록 모달이
                            뜨지만(get_design_context 853:5676), 그 모달은 html/common/modals.html
                            카탈로그에만 등록해뒀고 이 화면에는 연결하지 않는다(2026-09-02 사용자 요청). -->
                        <div class="task-list__panel" data-toggle-panel="task" hidden>
                            <div class="task-list__header">
                            업무목록 : &nbsp;&nbsp;
                                <input class="input input--w120" type="text" placeholder="업무명" id="task_keyword" name="task_keyword" value="">&nbsp;&nbsp;
                                <button type="button" class="task-list__item-add" id="btn_task_search">
                                    <span class="btn-icon-slot">
                                        <svg width="8" height="8" fill="none" aria-hidden="true">
                                            <use href="#svg_search" />
                                        </svg>
                                    </span>
                                    검색
                                </button>
                            </div>
                            <div class="task-list__body">
                                <div class="task-list__items" id="task_list">
                                </div>
                            </div>
                        </div>
                    </nav>
    
                    <!-- 결과 -->
                    <div class="task-result">
                        <div class="task-result__body">
                            <!-- OCR 업무에 적용할 서식 -->
                            <div class="task-section">
                                <div class="task-section__header">
                                    <span class="task-section__title">OCR 업무에 적용할 서식</span>
                                </div>
                                <div class="chip-row"></div>
                            </div>
                            <!-- 서식간 Rule 목록 -->
                            <div class="task-section">
                                <div class="task-section__header">
                                    <span class="task-section__title">서식간 Rule 목록</span>
                                    <div class="task-section__actions">
                                        <button type="button" class="btn-neutral" id="id_rule_regist">
                                            <span class="btn-icon-slot">
                                                <svg fill="none" aria-hidden="true">
                                                    <use href="#svg_rule_add"/>                                                    
                                                </svg>
                                            </span>
                                            추가
                                        </button>
                                        <button type="button" class="btn-neutral" onclick="fnRemoveRule();">
                                            <span class="btn-icon-slot">
                                                <svg fill="none" aria-hidden="true">
                                                    <use href="#svg_rule_del" />                                                        
                                                </svg>
                                            </span>
                                            삭제
                                        </button>
                                    </div>
                                </div>
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th style="width:40px">
                                                <label class="checkbox">
                                                    <input type="checkbox" class="checkbox__input">
                                                    <span class="checkbox__box">
                                                        <svg fill="none" aria-hidden="true">
                                                            <use href="#svg_attach_upload" />                                                            
                                                        </svg>
                                                    </span>
                                                </label>
                                            </th>
                                            <th style="width:200px">규칙명</th>
                                            <th style="width:200px">비교유형</th>
                                            <th>서식.항목</th>
                                        </tr>
                                    </thead>
                                    <tbody id="id_rule_table">
                                    </tbody>
                                </table>
                            </div>
                            <!-- Rule 상세 -->
                            <div class="task-section" id="rule_detail_area" style="display:none;">
                                <div class="task-section__header">
                                    <span class="task-section__title">Rule 상세</span>
                                </div>
                                <!-- patterns/detail-panel.css(2026-08-20) 재실측 반영 — 이전엔 .sub__search-area
                                    (회색 채움)였는데, 서식간 Rule 등록 모달의 동일 구조(규칙명/비교유형)가
                                    흰 배경+Neutral/100 보더로 재실측되어 detail-panel로 옮겨간 것과 같은
                                    성격이라 이 화면도 함께 교체했다. -->
                                <div class="detail-panel" style="gap:36px">
                                    <div class="split-view__search-item">
                                        <span class="split-view__search-label">규칙명</span>
                                        <input class="input" style="width:200px" type="text" id="id_rule_name" name="rule_name" value="" readonly>
                                    </div>
                                    <div class="split-view__search-item split-view__search-item--tight">
                                        <span class="split-view__search-label">비교유형</span>
                                        <input class="input" style="width:200px" type="text" id="id_rule_type" name="rule_type" value="" readonly>
                                    </div>
                                </div>
                                <div class="rule-field-box">
                                    <div class="rule-field-grid rule-grid"></div>
                                </div>
                            </div>
                            <!-- 기안 작성내용 -->
                            <div class="task-section">
                                <div class="task-section__header">
                                    <span class="task-section__title">기안 작성내용</span>
                                </div>
                                <textarea class="task-memo" id="bzwk_desc"></textarea>
                            </div>
                            <!-- 첨부파일 -->
                            <form id="attach_form">
                                <div class="task-section">
                                    <div class="task-section__header">
                                        <span class="task-section__title">첨부파일</span>
                                        <label for="input-upload" class="btn-neutral">
                                            <input type="file" name="files[]" id="input-upload" onchange="fnAddFile(this);" style="display:none;" multiple>
                                            <img th:src="@{/images/icons/buttons/ic-16-upload.svg}" alt="">
                                            업로드
                                        </label>
                                    </div>
                                    <table class="table">
                                        <thead>
                                            <tr>
                                                <th>이름</th>
                                                <th style="width:200px">크기</th>
                                                <th style="width:60px"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="id_attach_file">
                                            
                                        </tbody>
                                    </table>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:inline="javascript" type="text/javascript">
        var gRuleGroups = [];
        var gSelWkflows = [];
        
        const TYPE_FORM = 0; // 서식 타입
        const TYPE_TASK = 1; // 업무 타입
        
        var fileNo = 0;
        var files = [];
        
        var files = new Array();
        $(document).ready(function(){
            $("#id_appr_modal").on("click", function(event){
                openModal("approval-line-modal");
                setTimeout(() => {
                    $("#gubun").val("1");
                    $("#approval_keyword").val("");
                    $("#approval_keyword").focus();
                }, 50);
            });
            
            $("#id_rule_regist").on("click", function(event){
                if(gSelWkflows.length < 2){
                    openInformationModal("서식간 Rule을 등록하기 위해서는 2개이상의 서식이 선택되어야 합니다.", function(){
                    });
                    return;
                }
                openModal("cross-rule-register-modal");
                
                setTimeout(() => {
                	$("#crrm_rule_name").val("");
                    $("#crrm_rule_name").focus();
                });
            });
            
            $("#btn_form_search").on('click', function(){
            	fnGetWkflowList('FORM', $("#form_keyword").val());
            });
            
            $("#btn_task_search").on('click', function(){
            	fnGetWkflowList('TASK', $("#task_keyword").val());
            });
            
            fnGetWkflowList('all', '');
            
            openModal = function(id){
                var overlay = document.getElementById(id);
                if (overlay){
                    overlay.hidden = false;
                    overlay.style.display = "flex";
                }
            }
        });
        
        /**
         * 화면 다시 호출
         */
        function fnRefresh(){
            location.reload();
        }

        /**
         * 임시저장 버튼 클릭 시 호출
         */
        function fnTempSave(){
        }

        /**
         * 신청 버튼 클릭 시 호출
         */
        function fnSubmit(){

            var form = $("#attach_form")[0];
            var formData = new FormData(form);

        	if($("#bzwk_nm").val() === ""){
        		openInformationModal("업무명을 입력해 주세요.", function(){
        			$("#bzwk_nm").focus();
        		});
        		return;
            }
        
            //  첨부파일 추가
            for(let i=0 ; i<files.length ; i++){
                if(!files[i].is_delete){
                    formData.append("attach_file", files[i].file);
                }
            }

            formData.append("prgs_st_cd", "APPL");
            formData.append("bzwk_nm", $("#bzwk_nm").val());
            formData.append("bzwk_cd", $("#bzwk_cd").val());
            formData.append("description", $("#bzwk_desc").val());
            formData.append("scn_no", $("#scn_no").val());
        
            //  규칙 추가
            formData.append("rule_groups", JSON.stringify(gRuleGroups));
        
            //  결재선 추가
            let apprvList = [];
            $(".approval-list").each(function(index, item){
                apprvList.push({empno: item.dataset.id, seq:index + 1});
            });
        
            if(apprvList.length == 0 ){
                openInformationModal("결재선이 지정되어야 합니다.");
                return;
            }
            formData.append("approval_list", JSON.stringify(apprvList));
            
            let wkflowList = [];
            $(".chip").each(function(index, item){
            	 wkflowList.push({
                     id: item.dataset.id,
                     name: item.dataset.name
                 });
            });
            
            formData.append("wkflow_list", JSON.stringify(wkflowList));
        
            console.log("formData => ", formData);
        
            fetch(contextPath + 'api/v1/wkflow/apply', {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(res => {
                if(res.status == 200) {
                    location.href = contextPath + "module/apply/ocrTaskSearch?menuId=MENU0302";
                }
                else{
                    alert(res.message + "[" + res.status + "]");
                }
            })
            .catch(error => {
                console.error('실패', error);
                alert("오류가 발생했습니다.")
            });
        }
        
        //  서식/업무 목록 조회
        function fnGetWkflowList(tag, keyword){
            
            fetch(contextPath + 'api/v1/wkflow/list?tag=' + tag + '&keyword=' + keyword, {
                method: "GET"
            })
            .then(response => response.json())
            .then(res => {
                if(res.status == 200) {
                    console.log('성공', res.data);
                    if(tag == 'FORM'){
                        fnDisplayFormList(res.data.forms);
                    }
                    else if(tag == 'TASK'){
                    	fnDisplayTaskList(res.data.tasks);
                    }
                    else{
                    	fnDisplayFormList(res.data.forms);
                    	fnDisplayTaskList(res.data.tasks);
                    }
                }
                else{
                    alert(res.message + "[" + res.status + "]");
                }
            })
            .catch(error => {
                console.error('실패', error);
                alert("오류가 발생했습니다.")
            });
        }
        
        /**
         *  서식 목록 Display
         */
        function fnDisplayFormList(list){
        	$("#form_list").empty();
            list.forEach(function(item, index){
                let html = `
                   	<div class="task-list__item form_list">
                       <span class="task-list__item-name" data-id="${item.workflow_id}">${item.name}</span>
                       <button type="button" class="task-list__item-add" onclick="fnAddWkflow(0, '${item.workflow_id}');">
                           <svg width="10.6667" height="10.6667" fill="none" aria-hidden="true">
                               <use href="#svg_form_add"/>                                          
                           </svg>
                           추가
                       </button>
                       <span class="task-list__item-badge" style="display:none;">추가됨</span>
                   </div>
               `;
               $("#form_list").append(html);
            });
        }
        
        /**
         *  서식 목록 Display
         */
        function fnDisplayTaskList(list){
            $("#task_list").empty();
            list.forEach(function(item, index){
            	let html = `
                    <div class="task-list__item">
                		<span class="task-list__item-name" data-id="${item.workflow_id}">${item.wkflowNm}(${item.wkflows.length})</span>
                        <svg class="nav-item__chevron" viewBox="0 0 16 16" fill="none" onclick="expandTask('${item.wkflowId}');">
                            <use href="#svg_accordion" />
                        </svg>
                   </div>                       
                   <div class="task-list__item" id="task_${item.wkflowId}" style="display:none;">
                   `;
                   
                   item.wkflows.forEach(function(subItem, index2){
                       html += `
                           <div  class="task-list__item task_list" id="task_${subItem.wkflowId}">     
                               <span class="task-list__item-name" data-id="${subItem.wkflowId}">${subItem.wkflowNm}</span>
                               <span class="task-list__item-badge" style="display:none;">추가됨</span>
                               <button type="button" class="task-list__item-add" onclick="fnAddWkflow(1, '${subItem.wkflowId}');">
                                   <svg width="10.6667" height="10.6667" fill="none" aria-hidden="true">
                                       <use href="#svg_form_add"/>
                                   </svg>
                                   추가
                               </button>
                       </div>
                       `;
                   });
                   
                   html += `</div>`;
               $("#task_list").append(html);
            });
        }
        
        function expandTask(wkflowId){
            let ele = document.getElementById("task_" + wkflowId); 
            if(ele.style.display === "none"){
                ele.style.display = 'block';
            }
            else{
                ele.style.display = 'none';
            }
        }
        
        /**
         * 업무 목록에서 추가됨 버튼 클릭 시 호출하는 함수
         * @param wkflowId
         */
        function fnAddWkflow(type, wkflowId){
            var eleList = $(".form_list");
            if(type == TYPE_TASK){
                eleList = $(".task_list");
            }
        
            eleList.each(function(index, item){
                let tempId = item.firstElementChild.dataset.id;
        
                console.log(wkflowId + " : " + tempId);
        
                if(wkflowId == tempId){
        
                    fetch(contextPath + 'api/v1/wkflow/' + wkflowId, {
                        method: "GET"
                    })
                    .then(response => response.json())
                    .then(res => {
                        if(res.status == 200) {
                            console.log('성공', res.data);
                            var overlay = document.getElementById("form-field-rule-modal");
                            if (overlay){
                              overlay.hidden = false;
                              overlay.style.display = "flex";
                            }
        
                            FormFieldRule_initialize(res.data);
                        }
                        else{
                            alert(res.message + "[" + res.status + "]");
                        }
                    })
                    .catch(error => {
                        console.error('실패', error);
                        alert("오류가 발생했습니다.")
                    });
                    return false;
                }
            });
        }
        
        /**
         * OCR 업무에 적용할 서식 영역에 서식을 추가한다.
         *
         * @param type (0: 서식, 1:업무)
         * @param wkflowId
         * @param wkflowNm
         */
        function addWkflow(type, wkflow){
            console.log("addWkflow => ", wkflow);
            let html = `
                <span class="chip" data-id="${wkflow.id}" data-type="${type}" data-name="${wkflow.name}">
                    <label class="checkbox checkbox--lg">
                        <input type="checkbox" class="checkbox__input" checked>
                    </label>
                    <span class="chip__label">${wkflow.name}</span>
                    <button type="button" class="chip__delete" aria-label="삭제" onclick="removeWkflow('${wkflow.id}')">
                        <svg fill="none" aria-hidden="true">
                            <use href="#svg_form_del" />
                        </svg>
                    </button>
                </span>
            `;
        
            $('.chip-row').append(html);
        }
        
        /**
         * 1. OCR 업무에 적용할 서식 영역에 서식을 제거한다.
         * 2. 서식간 rule 추가 팝업에 workflow룰 제거한다.
         * @param type (0: 서식, 1:업무)
         * @param wkflowId
         */
        function removeWkflow(wkflowId){
            //  1. OCR 업무에 적용할 서식 영역에 서식을 제거한다.
            //  서식 목록 체크
            var eleList = $(".form_list");
            eleList.each(function(index, item){
                let tempId = item.firstElementChild.dataset.id;
                if(tempId == wkflowId){
                    console.log(item);
        
                    item.getElementsByClassName('task-list__item-add')[0].style.display = '';
                    item.getElementsByClassName('task-list__item-badge')[0].style.display = 'none';
                    return false;
                }
            });
            
            //  업무 목록 체크
            eleList = $(".task_list");
            eleList.each(function(index, item){
                let tempId = item.firstElementChild.dataset.id;
                if(tempId == wkflowId){
                    console.log(item);
        
                    item.getElementsByClassName('task-list__item-add')[0].style.display = '';
                    item.getElementsByClassName('task-list__item-badge')[0].style.display = 'none';
                    return false;
                }
            });

        
            $(".chip").each(function(index, item){
                if(item.dataset.id == wkflowId){
                    $(this).remove();
                }
            });
        
            // 2. 서식간 rule 추가 팝업에 workflow룰 제거한다.
            CrossRuleRegist_remove(wkflowId);
            
            for(let i=0 ; i<gSelWkflows.length ; i++){
                if(gSelWkflows[i].id == wkflowId){
                    gSelWkflows.splice(i, 1);
                }
            }
        }
        
        /**
         * 서식간 Rule 목록 테이블의 row를 클릭 했을 시 호출
         * Rule 상세 영역을 Display 한다.
         */
        function fnDisplayRuleDetail(idx){
            $(".rule-grid").empty();
        
            const ruleGroup = gRuleGroups[idx];
            $("#id_rule_name").val(ruleGroup.name);
            $("#id_rule_type").val(ruleGroup.type_name);
            for(const wkflow of ruleGroup.wkflows){
                let html = `
                    <div class="rule-field-card">
                        <label class="checkbox checkbox--lg">
                            <input type="checkbox" class="checkbox__input" checked>
                            <span class="checkbox__box">
                                <svg fill="none" aria-hidden="true">
                                    <use href="#svg_checkbox" />
                                </svg>
                            </span>
                        </label>
                        <div class="rule-field-card__info">
                            <span class="rule-field-card__label">${wkflow.name}(${wkflow.value})</span>
                        </div>
                    </div>
                `;
                $(".rule-grid").append(html);
            }
        
            gRuleGroups.forEach(function(item, index){
                if(index == idx ){
                    item.displayYn = true;
                }
                else{
                    item.displayYn = false;
                }
            });
        
            $("#rule_detail_area").show();
        }
        
        /**
         * Rule을 제거함.
         */
        function fnRemoveRule(){
            $("#id_rule_tr").each(function(index, item){
                if(item.getElementsByTagName('input')[0].checked){
                    gRuleGroups[index].delYn = true;
                    $(this).empty();
        
                    if(gRuleGroups[index].displayYn == true){
                        $("#rule_detail_area").hide();
                        $(".rule-grid").empty();
                    }
                }
            });
        }
        
        /**
         * 결재선 팝업에서 확인 클릭 시 호출
         */
        function callbackApprChain(arr){
            console.log("callbackApprChain => ", arr);
            let apprChain = "";
            arr.forEach(function(item, index){
                apprChain += item.empnm + "(결재) > ";
            });
            $("#approval_chain").val(apprChain.substring(0, apprChain.length - 3));
        }
        
        /**
         * form-field-rule-modal 팝업의 callback 함수
         */
        function callback_FormFieldRule(workflow){
            console.log("callbackFormField => ", workflow);
            
            var eleList = $(".task_list");
            //  업무 목록 하위에 있는 서식 처리
            eleList.each(function(index, item){
                let tempId = item.firstElementChild.dataset.id;
        
                if(workflow.id == tempId){
                   item.getElementsByClassName('task-list__item-add')[0].style.display = 'none';
                   item.getElementsByClassName('task-list__item-badge')[0].style.display = '';
                   return false;
                }
            });
            
            //  서식 목록 하위에 있는 서식 처리
            eleList = $(".form_list");
            eleList.each(function(index, item){
                let tempId = item.firstElementChild.dataset.id;
        
                if(workflow.id == tempId){
                   item.getElementsByClassName('task-list__item-add')[0].style.display = 'none';
                   item.getElementsByClassName('task-list__item-badge')[0].style.display = '';
                   return false;
                }
            });
            
            gSelWkflows.push(workflow);
            
            //  OCR 업무에 적용할 서식 영역 처리
            addWkflow(0, workflow);
        
            //  cross-rule-register-modal 팝업에 데이터 세팅
            CrossRuleRegist_add(0, workflow);
        }
        
        /**
         * cross-rule-register-modal 팝업의 callback
         * 전역 변수인 gRuleGroups에 ruleGroup을 추가하고 서식간 Rule 목록 테이블에 row를 추가한다.
         */
        function callback_CrossRuleRegister(group){
            console.log("callback_CrossRuleRegister => ", group);
            
        	let tempGroups = gRuleGroups.filter((t) => t.name == group.name);
        	if(tempGroups.length > 0 ){
        		openInformationModal("이미 추가된 Rule 입니다.", function(){
                });
        		return;
        	}
        	
        	gRuleGroups.push(group);
        	
            let wkflowNames = "";
            group.wkflows.forEach(function(item, index){
            	wkflowNames += item.name + ",";
            });
        
            wkflowNames = wkflowNames.substring(0, wkflowNames.length - 1);
        
            //  2. rule 그룹 테이블에 추가
            let html = `
                <tr id="id_rule_tr" onclick="fnDisplayRuleDetail(${group.idx});">
                  <td>
                      <label class="checkbox">
                          <input type="checkbox" class="checkbox__input">
                          <span class="checkbox__box">
                              <svg fill="none" aria-hidden="true">
                                  <use href="#svg_checkbox" />
                              </svg>
                          </span>
                      </label>
                  </td>
                  <td>${group.name}</td>
                  <td>${group.type}</td>
                  <td style="text-align:left">${wkflowNames}</td>
                </tr>
            `;
        
            $("#id_rule_table").append(html);
            
        }
        
        function fnAddFile(obj){
            for(const file of obj.files){
                fnDisplayFileInfo(file);
            }
        }
        
        function fnDisplayFileInfo(file){
            if(validation(file)){
                let reader = new FileReader();

                reader.readAsDataURL(file);

                reader.onload = function(){
                    let tempFile = {
                        file: file,
                        is_delete: false
                    }
                    files.push(tempFile);
                    
                    let html = `
                    	<tr id="file-idx-${fileNo}">
                    	   <td style="text-align:left">${file.name}</td>
                    	   <td>${file.size}</td>
                           <td>
                               <button type="button" class="extract-field__delete" onclick="fnRemoveFile(${fileNo})" aria-label="첨부파일 삭제">
                                   <span class="btn-icon-slot">
                                       <svg fill="none" aria-hidden="true">
                                           <use href="#svg_attach_del">
                                       </svg>
                                   </span>
                               </button>
                           </td>
                       </tr>
                    `;

                    $("#id_attach_file").append(html);
                    fileNo++;
                }
            }
        }
        
        function validation(file){
            const fileTypes = ["application/pdf", "image/gif", "image/jpeg", "image/png", "image/bmp", "image/tiff"];
            
            if(file.name.lastIndexOf(".") == -1){
                alert("확장자가 없는 파일은 제외됩니다.");
                return false;
            }
            else if(!fileTypes.includes(file.type)){
                alert("허가된 파일만 첨부됩니다.");
                return false;
            }
            
            return true;
        }
        
        function fnRemoveFile(num){
            document.querySelector("#file-idx-" + num).remove();
            files[num].is_delete = true;
        }
    </script>
    <div th:insert="~{common/popup/form-field-rule-modal :: form-field-rule-modal}"></div>
    <div th:insert="~{common/popup/cross-rule-register-modal :: cross-rule-register-modal}"></div>
    <div th:insert="~{common/popup/approval-line-modal :: approval-line-modal}"></div>
    <div th:insert="~{common/commonModals :: commonModals}"></div>
</div>
</body>
