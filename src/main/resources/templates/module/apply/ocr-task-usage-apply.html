<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/defaultLayout}"
      layout:fragment="Content"
>
<head>
  <meta charset="UTF-8">
  <title>OCR업무사용신청 | AI OCR 서류판독시스템</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    /* 수정된 행 표시 : portal 표(.table)에 "수정됨" 상태 클래스가 없어 이 한 줄만 추가 */
    .table tr.is-modified td { background: var(--status-warning-surface); }
  </style>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="svg_search" viewBox="0 0 11.5 11.5">
        <path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_first" viewBox="0 0 9.5 8.16667">
        <path d="M8.75 7.41667L5.41667 4.08333L8.75 0.75M4.08333 7.41667L0.75 4.08333L4.08333 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_prev" viewBox="0 0 5.5 9.5">
        <path d="M4.75 8.75L0.75 4.75L4.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_next" viewBox="0 0 5.5 9.5">
        <path d="M0.75 8.75L4.75 4.75L0.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_move_last" viewBox="0 0 9.5 8.16667">
        <path d="M0.75 7.41667L4.08333 4.08333L0.75 0.75M5.41667 7.41667L8.75 4.08333L5.41667 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 모달 / 결재선 지정 모달(approval-line-modal)이 쓰는 아이콘 -->
    <symbol id="svg_modal_close" viewBox="0 0 7.725 7.725">
        <path d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375" stroke="currentColor" stroke-width="0.975" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_btn_primary" viewBox="0 0 9.2 6.7">
        <path d="M8.6 0.6L3.1 6.1L0.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_checkbox" viewBox="0 0 12 12">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M9.83263 3.64645C10.0558 3.84171 10.0558 4.15829 9.83263 4.35355L5.2612 8.35355C5.03805 8.54882 4.67624 8.54882 4.45308 8.35355L2.16737 6.35355C1.94421 6.15829 1.94421 5.84171 2.16737 5.64645C2.39052 5.45118 2.75233 5.45118 2.97549 5.64645L4.85714 7.29289L9.02451 3.64645C9.24767 3.45118 9.60948 3.45118 9.83263 3.64645Z" fill="currentColor"/>
    </symbol>
    <symbol id="svg_arrow_add" viewBox="0 0 5.5 9.5">
        <path d="M0.75 8.75L4.75 4.75L0.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="svg_arrow_remove" viewBox="0 0 5.5 9.5">
        <path d="M4.75 8.75L0.75 4.75L4.75 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
</svg>
        <main class="content">
            <div class="page-header">
                <h1 class="page-header__title">OCR업무사용신청</h1>
                <div class="page-header__actions">
                    <button type="button" class="btn-outline-primary" id="btn_use_apply">사용신청</button>
                    <button type="button" class="btn btn-primary" id="btn_save">저장</button>
                </div>
            </div>

            <div class="tab-panel">
                <div class="layout-list">
                    <!-- 검색 조건 -->
                    <form name="form" id="form" class="search-area" onsubmit="return false;">
                        <input type="hidden" id="page_no" name="page_no" value="1" />
                        <input type="hidden" id="page_size" name="page_size" value="15" />
                        <div class="search-area__row">
                            <!--<div class="search-area__item">
                                <label class="search-area__label" for="ocr_work_nm">OCR 업무명</label>
                                <input id="ocr_work_nm" name="ocr_work_nm" class="input input&#45;&#45;w200" type="text" placeholder="OCR 서식명을 입력하세요">
                            </div>
                        </div>-->
                            <div class="search-area__item">
                                <label class="search-area__label" for="ocr_work_nm">OCR 업무명</label>
                                <div class="search-area__combo">
                                    <input id="ocr_work_nm" name="ocr_work_nm" class="input input--w200" type="text" disabled="true" placeholder="업무명을 입력하세요">
                                    <input type="hidden" id="wk_id" name="wk_id" value="">
                                    <!-- 업무 검색 팝업 열기 -->
                                    <button type="button" class="btn-icon" id="btn_task_popup" aria-label="업무 검색">
                                        <svg width="11.5" height="11.5" fill="none" aria-hidden="true">
                                            <use href="#svg_search" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="search-area__actions">
                            <button type="button" class="btn-icon" id="btn_reset">
                                <img th:src="@{/images/icons/buttons/ic-16-refresh.svg}" alt="초기화">
                            </button>
                            <button type="button" class="btn-outline-primary" id="btn_submit">
                                <span class="btn-icon-slot">
                                    <svg width="11.5" height="11.5" fill="none" aria-hidden="true">
                                        <use href="#svg_search" />
                                    </svg>
                                </span>
                                조회
                            </button>
                        </div>
                    </form>

                    <!-- 목록 -->
                    <div class="list-section">
                        <div class="list-section__header">
                            <h2 class="list-section__title">OCR 서식 항목 목록</h2>
                            <span class="list-footer__count">수정된 행 : <strong id="changed_count">0</strong>건 (행을 더블클릭하면 상세 수정)</span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th style="width:60px">No</th>
                                    <th style="width:20%">업무명</th>
                                    <th style="width:15%">OCR 서식</th>
                                    <th style="width:10%">서식코드</th>
                                    <th style="width:20%">추출항목</th>
                                    <th style="width:15%">화면번호</th>
                                    <th>매핑정보</th>
                                    <!-- 표시순서 : 나중에 쓸 수 있어 숨김만 (보이게 하려면 display:none 삭제) -->
                                    <th style="width:90px; display:none">표시순서</th>
                                </tr>
                            </thead>
                            <tbody id="id_usage_list">
                            </tbody>
                        </table>

                        <div class="list-footer">
                            <span class="list-footer__count" id="list_count"></span>
                            <nav class="pagination"></nav>
                            <select id="page-size" class="input input--w140 list-footer__page-size">
                                <option value="15">15개씩 보기</option>
                                <option value="30">30개씩 보기</option>
                                <option value="50">50개씩 보기</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </main>

<!-- ===== 상세 수정 모달 (행 더블클릭) ===== -->
<div id="usage-detail-modal" class="modal-overlay" hidden>
    <div class="modal modal--md">
        <div class="modal__header">
            <span class="modal__title">서식 항목 상세</span>
            <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
                <svg width="7.725" height="7.725" fill="none" aria-hidden="true"><use href="#svg_modal_close" /></svg>
            </button>
        </div>
        <div class="modal__body">
            <div class="modal__row">
                <span class="modal__row-label">업무명</span>
                <span class="modal__row-value" id="dtl_wk_nm"></span>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">OCR 서식</span>
                <span class="modal__row-value" id="dtl_ocr_doc"></span>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">서식코드</span>
                <span class="modal__row-value" id="dtl_ocr_code"></span>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">추출항목</span>
                <span class="modal__row-value" id="dtl_read_item"></span>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">화면번호</span>
                <input class="input" type="text" id="dtl_disp_number" maxlength="20">
            </div>
            <div class="modal__row">
                <span class="modal__row-label">매핑정보</span>
                <input class="input" type="text" id="dtl_mapping_info" maxlength="200">
            </div>
            <div class="modal__row" style="display:none">   <!-- 표시순서 : 숨김 -->
                <span class="modal__row-label">표시순서</span>
                <input class="input input--w120" type="text" id="dtl_disp_ord" maxlength="5" inputmode="numeric" placeholder="숫자만">
            </div>
        </div>
        <div class="modal__footer">
            <div class="modal__footer-actions">
                <button type="button" class="btn-outline-primary" data-modal-close>취소</button>
                <button type="button" class="btn btn-primary" id="btn_detail_apply">
                    <span class="btn-icon-slot">
                        <svg width="9.2" height="6.7" fill="none" aria-hidden="true"><use href="#svg_btn_primary" /></svg>
                    </span>
                    적용
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 업무 검색 모달 (돋보기) ===== -->
<div id="task-search-modal" class="modal-overlay" hidden>
    <div class="modal modal--w600">
        <div class="modal__header">
            <span class="modal__title">업무 검색</span>
            <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
                <svg width="7.725" height="7.725" fill="none" aria-hidden="true"><use href="#svg_modal_close" /></svg>
            </button>
        </div>
        <div class="modal__body">
            <div class="search-area__combo">
                <input class="input" type="text" id="task_keyword" placeholder="업무명을 입력하세요" style="flex:1">
                <button type="button" class="btn-outline-primary" id="btn_task_search">
                    <span class="btn-icon-slot">
                        <svg width="11.5" height="11.5" fill="none" aria-hidden="true"><use href="#svg_search" /></svg>
                    </span>
                    검색
                </button>
            </div>
            <div style="max-height:360px; overflow-y:auto">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width:50px">No</th>
                            <th>업무명</th>
                            <th style="width:80px">서식 수</th>
                            <th style="width:80px">상태</th>
                        </tr>
                    </thead>
                    <tbody id="task_list">
                        <tr><td colspan="4">업무명을 입력하고 검색하세요.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal__footer">
            <div class="modal__footer-actions">
                <button type="button" class="btn-outline-primary" data-modal-close>취소</button>
                <button type="button" class="btn btn-primary" id="btn_task_apply">
                    <span class="btn-icon-slot">
                        <svg width="9.2" height="6.7" fill="none" aria-hidden="true"><use href="#svg_btn_primary" /></svg>
                    </span>
                    선택
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 사용신청 모달 ===== -->
<div id="usage-apply-modal" class="modal-overlay" hidden>
    <div class="modal modal--w600">
        <div class="modal__header">
            <span class="modal__title">사용 신청</span>
            <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
                <svg width="7.725" height="7.725" fill="none" aria-hidden="true"><use href="#svg_modal_close" /></svg>
            </button>
        </div>
        <div class="modal__body">
            <div class="modal__row">
                <span class="modal__row-label">신청자</span>
                <span class="modal__row-value"
                      th:text="${loginUser != null} ? ${loginUser.userName + ' (' + loginUser.userId + ')'} : '로그인 정보가 없습니다.'"></span>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">업무명</span>
                <span class="modal__row-value" id="apply_ocr_doc_text"></span>
                <input type="hidden" id="apply_ocr_doc">
                <input type="hidden" id="apply_ocr_code">
            </div>
            <div class="modal__row modal__row--textarea">
                <span class="modal__row-label">신청사유</span>
                <div class="modal__textarea-wrap">
                    <textarea class="modal__textarea" id="apply_reason" placeholder="신청사유를 입력하세요 (최대 100byte)"></textarea>
                    <span class="modal__textarea-count">
                        <span class="modal__textarea-count-current" id="apply_reason_bytes">0</span>
                        <span class="modal__textarea-count-max">/ 100byte</span>
                    </span>
                </div>
            </div>
            <div class="modal__row">
                <span class="modal__row-label">결재선</span>
                <input class="input" type="text" id="approval_chain" value="" placeholder="결재선을 지정하세요." readonly>
                <button type="button" class="btn-neutral" id="btn_appr_line">결재선 지정</button>
            </div>
        </div>
        <div class="modal__footer">
            <div class="modal__footer-actions">
                <button type="button" class="btn-outline-primary" data-modal-close>취소</button>
                <button type="button" class="btn btn-primary" id="btn_apply_save">
                    <span class="btn-icon-slot">
                        <svg width="9.2" height="6.7" fill="none" aria-hidden="true"><use href="#svg_btn_primary" /></svg>
                    </span>
                    사용 신청
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 결재선 지정 모달 (portal 공통) : 사용신청 모달보다 뒤에 둬야 위에 겹쳐 보임 -->
<div th:insert="~{common/popup/approval-line-modal :: approval-line-modal}"></div>
<!-- 알림/확인 공통 모달 -->
<div th:insert="~{common/commonModals :: commonModals}"></div>

<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/apply/ocr-task-usage-apply.js}"></script>
<script th:src="@{/js/lnb.js}"></script>
</body>
</html>
