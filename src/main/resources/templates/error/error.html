<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>에러 발생</title>
</head>
<body>
    <h1>에러가 발생했습니다.</h1>
    <p>상태 코드: <span th:text="${status}"></span></p>
    <p>에러 내용: <span th:text="${error}"></span></p>
    <p>요청 경로: <span th:text="${path}"></span></p>
    <p>매시지: <span th:text="${message}"></span></p>
</body>
</html>
