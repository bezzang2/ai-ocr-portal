<!DOCTYPE html>
<!-- Thymeleaf 선언 / headerFragment 임을 선언-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="HeaderFragment">
<!-- include: common/gnb.html -->
<header class="gnb">
    <a class="gnb__brand" th:href="@{/index}" title="홈으로 이동"><img class="gnb__brand-logo" th:src="@{/images/kjbank-logo.png}" alt="광주은행 홈"></a>
    <nav class="breadcrumb">
    </nav>
    <div class="gnb__user">
        <div class="gnb__user-name-group">
            <img class="gnb__user-icon" th:src="@{/images/icons/gnb/ic-16-user.svg}" alt="">
            <span class="gnb__user-name" th:text="${session.ssoLoginUser != null ? session.ssoLoginUser.userName + ' (' + session.ssoLoginUser.userId + ')' : '로그인 정보 없음'}"></span>
            <span class="gnb__user-dept" th:text="${session.ssoLoginUser != null ? session.ssoLoginUser.deptName : ''}"></span>
        </div>
        <div class="gnb__notif">
            <img class="gnb__notif-icon" th:src="@{/images/icons/gnb/ic-16-notification.svg}" alt="알림">
            <span class="gnb__notif-badge" aria-hidden="true" th:if="${hasUnreadNotifications == true}"></span>
        </div>
    </div>
</header>
<script th:inline="javascript" type="text/javascript">
$(function(){
	console.log("----------- HEADER START");
	const breadcrumb = [];
	
	$(".nav-item").each((index, item) => {
		if($(item).hasClass("is-active")){
			breadcrumb.push(item.querySelector(".nav-item__label").textContent);
			
			let subEle = Array.from(item.parentElement.querySelector(".nav-submenu").children);

			// 이제 forEach 사용 가능!
			subEle.forEach(child => {
				if($(child).hasClass("is-selected")){
					breadcrumb.push(child.textContent.trim());
					return true;
				}
			});
			
			return true;
		}
	});
	
	console.log(breadcrumb);
	
	$(".breadcrumb").html(`
        <span class="breadcrumb__item">${breadcrumb[0]}</span>
        <img class="breadcrumb__arrow" src="${contextPath}/images/icons/gnb/ic-16-breadcrumb-arrow.svg" alt="">
        <span class="breadcrumb__item breadcrumb__item--current">${breadcrumb[1]}</span>
	`);
});
</script>
</html>
