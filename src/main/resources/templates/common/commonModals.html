<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>

  </style>
</head>
<body>
<div th:fragment="commonModals">

  <!-- Warning Alert — get_design_context(821:3955) 실측 -->
  <div id="warning-alert-modal" class="modal-overlay" hidden>
    <div class="alert">
      <div class="alert__header">
        <img class="alert__icon" th:src="@{/images/icons/alert/ic-24-warning.svg}" alt="">
        <span class="alert__title">Warning</span>
        <button type="button" class="alert__close" aria-label="닫기" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-x-close.svg}" alt="">
        </button>
      </div>
      <div class="alert__message">
        <p>알림 메세지를 입력하세요.</p>
      </div>
      <div class="alert__actions">
        <button type="button" id="alertNo" class="btn-outline-primary btn-outline-primary--sm" style="width: 70px" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-x-no.svg}" alt="">
          아니오
        </button>
        <button type="button" id="alertYes" class="btn btn-primary btn-primary--sm" style="width: 70px" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-check.svg}" alt="">
          예
        </button>
      </div>
    </div>
  </div>

  <!-- Success Alert — get_design_context(821:3955) 실측 -->
  <div id="success-alert-modal" class="modal-overlay" hidden>
    <div class="alert">
      <div class="alert__header">
        <img class="alert__icon" th:src="@{/images/icons/alert/ic-24-check-circle.svg}" alt="">
        <span class="alert__title">Success</span>
        <button type="button" class="alert__close" aria-label="닫기" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-x-close.svg}" alt="">
        </button>
      </div>
      <div class="alert__message">
        <p>알림 메세지를 입력하세요.</p>
      </div>
      <div class="alert__actions">
        <button type="button" id="successConfirmBtn" class="btn btn-primary btn-primary--sm" style="width: 70px" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-check.svg}" alt="">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- Error Alert — get_design_context(821:3955) 실측 -->
  <div id="error-alert-modal" class="modal-overlay" hidden>
    <div class="alert">
      <div class="alert__header">
        <img class="alert__icon" th:src="@{/images/icons/alert/ic-24-x-circle.svg}" alt="">
        <span class="alert__title">Error</span>
        <button type="button" class="alert__close" aria-label="닫기" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-x-close.svg}" alt="">
        </button>
      </div>
      <div class="alert__message">
        <p>알림 메세지를 입력하세요.</p>
      </div>
      <div class="alert__actions">
        <button type="button" id="errorBtn" class="btn btn-primary btn-primary--sm" style="width: 70px" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-check.svg}" alt="">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- Information Alert — get_design_context(821:3955) 실측 -->
  <div id="information-alert-modal" class="modal-overlay" hidden>
    <div class="alert">
      <div class="alert__header">
        <img class="alert__icon" th:src="@{/images/icons/alert/ic-24-bell.svg}" alt="">
        <span class="alert__title">Information</span>
        <button type="button" class="alert__close" aria-label="닫기" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-x-close.svg}" alt="">
        </button>
      </div>
      <div class="alert__message">
        <p>알림 메세지를 입력하세요.</p>
      </div>
      <div class="alert__actions">
        <button type="button" id="informationBtn" class="btn btn-primary btn-primary--sm" style="width: 70px" data-modal-close>
          <img th:src="@{/images/icons/alert/ic-12-check.svg}" alt="">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 엑셀다운 모달 — get_design_context(508:15009) 실측, ocr-form-search.html과 동일 마크업 -->
  <div id="excel-download-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title">엑셀 다운 사유</span>
        <button
                type="button"
                class="modal__close"
                aria-label="닫기"
                data-modal-close
        >
          <svg
                  width="7.725"
                  height="7.725"
                  viewBox="0 0 7.725 7.725"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
          >
            <path
                    d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375"
                    stroke="currentColor"
                    stroke-width="0.975"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="modal__row">
          <span class="modal__row-label">신청자</span>
          <span class="modal__row-value">홍길동 대리(1234567)</span>
        </div>
        <div class="modal__row">
          <span class="modal__row-label">날짜</span>
          <span class="modal__row-value">2026-08-11 오전 09:55</span>
        </div>
        <div class="modal__row">
          <span class="modal__row-label">메뉴</span>
          <span class="modal__row-value">신청관리 > OCR신청색</span>
        </div>
        <div class="modal__row modal__row--textarea">
          <span class="modal__row-label">다운로드 사유</span>
          <textarea
                  class="modal__textarea"
                  id="excelDownloadReason"
                  placeholder="다운로드 사유를 입력하세요"
          >
업무참고</textarea
          >
        </div>
      </div>
      <div class="modal__footer">
        <div class="modal__footer-actions">
          <button type="button" class="btn-outline-primary" data-modal-close>
              <span class="btn-icon-slot"
              ><svg
                      width="7.725"
                      height="7.725"
                      viewBox="0 0 7.725 7.725"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
              >
                  <path
                          d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375"
                          stroke="currentColor"
                          stroke-width="0.975"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                  /></svg
              ></span>
            취소
          </button>
          <button type="button" class="btn btn-primary" data-modal-close onclick="confirmExcelDownload()">
              <span class="btn-icon-slot"
              ><svg
                      width="9.2"
                      height="6.7"
                      viewBox="0 0 9.2 6.7"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
              >
                  <path
                          d="M8.6 0.6L3.1 6.1L0.6 3.6"
                          stroke="currentColor"
                          stroke-width="1.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                  /></svg
              ></span>
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 사용자 정보 모달 -->
  <div id="user-modal" class="modal-overlay" hidden>
    <!-- get_design_context(617:8001) 재실측(2026-08-20) — 폭이 1200px(.modal--lg) →
         600px로 줄어 .modal--w600으로 교체. -->
    <div class="modal modal--w600">
      <div class="modal__header">
        <span class="modal__title">사용자 정보</span>
        <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
          <svg width="7.725" height="7.725" viewBox="0 0 7.725 7.725" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375" stroke="currentColor" stroke-width="0.975" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="modal__body">

        <!-- 검색바 — get_design_context(617:8011) 실측. 결재선 지정 모달과 동일한 .sub__search-area
             패턴(4번째 재사용처) 재사용, 세로 패딩만 이 인스턴스 실측값(8px)으로 인라인 조정. -->
        <div class="sub__search-area" style="padding:8px 12px">
          <div class="split-view__search-item" style="display: flex; align-items: center; gap: 5px; flex: 1;">
            <span class="search-area__label">사번</span>
            <input class="input" style="width: 100%; min-width: 0; box-sizing: border-box;" type="text" placeholder="사번" id="empNo">
          </div>
          <div class="split-view__search-item" style="display: flex; align-items: center; gap: 5px; flex: 1;">
            <span class="search-area__label">이름</span>
            <input class="input" style="width: 100%; min-width: 0; box-sizing: border-box;" type="text" placeholder="이름" id="empKorFlnm">
          </div>
          <button type="button" class="btn-outline-primary" id="commonUserSearchBtn" style="flex: 0 0 auto; white-space: nowrap;" onclick="searchCommonUser()">
            <span class="btn-icon-slot"><svg viewBox="0 0 11.5 11.5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            검색
          </button>
        </div>
        <div class="common-user-table-wrap"
             style="height: 300px; max-height: 300px; overflow-y: scroll; overflow-x: hidden;">
          <!-- 대상자 목록 — get_design_context(617:8019, 617:8001) 실측/재실측(2026-08-20).
               Figma상 기OO 행의 파란 배경(Blue/50)은 .table tbody tr:hover(table.css)와 동일한
               색으로, 마우스오버 중인 상태를 캡처한 것으로 판단해 고정 배경이 아니라 hover로만
               나타나게 둔다(정적 인라인 배경 지정 안 함). 마지막 열은 헤더 라벨 없이 행 삭제(X)
               아이콘만. 칼럼폭 2026-08-20 재실측: 이름 120→80, 아이디 auto→80, 직위 160→100,
               역할권한 auto→100, 삭제 60→32(소속은 그대로 auto/flex). -->
          <table class="table" style="table-layout:fixed; width:100%">
            <colgroup>
              <col style="width:80px">
              <col style="width:80px">
              <col>
              <col style="width:100px">
              <col style="width:100px">
            </colgroup>
            <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>부서</th>
              <th>직위명</th>
              <th>직급명</th>
            </tr>
            </thead>
            <tbody id="commonUserBody">
            </tbody>
          </table>
        </div>

      </div>
      <div class="modal__footer">
        <div class="modal__footer-actions">
          <button type="button" class="btn btn-primary" style="width:80px" data-modal-close>
            <span class="btn-icon-slot"><svg width="11.8667" height="8.53333" viewBox="0 0 11.8667 8.53333" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.2667 0.6L3.93333 7.93333L0.6 4.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            닫기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 부서 정보 모달 -->
  <div id="dept-modal" class="modal-overlay" hidden>
    <!-- get_design_context(617:8001) 재실측(2026-08-20) — 폭이 1200px(.modal--lg) →
         600px로 줄어 .modal--w600으로 교체. -->
    <div class="modal modal--w640">
      <div class="modal__header">
        <span class="modal__title">부서 정보</span>
        <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
          <svg width="7.725" height="7.725" viewBox="0 0 7.725 7.725" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375" stroke="currentColor" stroke-width="0.975" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="modal__body">

        <!-- 검색바 — get_design_context(617:8011) 실측. 결재선 지정 모달과 동일한 .sub__search-area
             패턴(4번째 재사용처) 재사용, 세로 패딩만 이 인스턴스 실측값(8px)으로 인라인 조정. -->
        <div class="sub__search-area" style="padding:8px 12px">
          <div class="split-view__search-item" style="display: flex; align-items: center; gap: 5px; flex: 1;">
            <span class="search-area__label">부서코드</span>
            <input class="input" style="width: 100%; min-width: 0; box-sizing: border-box;" type="text" placeholder="코드" id="brCd">
          </div>
          <div class="split-view__search-item" style="display: flex; align-items: center; gap: 5px; flex: 1;">
            <span class="search-area__label">부서명</span>
            <input class="input" style="width: 100%; min-width: 0; box-sizing: border-box;" type="text" placeholder="부서명" id="brNm">
          </div>
          <button type="button" class="btn-outline-primary" id="commonDeptSearchBtn" style="flex: 0 0 auto; white-space: nowrap;" onclick="searchCommonDept()">
            <span class="btn-icon-slot"><svg viewBox="0 0 11.5 11.5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10.75 10.75L8.33333 8.33333M9.63889 5.19444C9.63889 7.64904 7.64904 9.63889 5.19444 9.63889C2.73985 9.63889 0.75 7.64904 0.75 5.19444C0.75 2.73985 2.73985 0.75 5.19444 0.75C7.64904 0.75 9.63889 2.73985 9.63889 5.19444Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            검색
          </button>
        </div>
        <div class="common-user-table-wrap"
             style="height: 300px; max-height: 300px; overflow-y: scroll; overflow-x: hidden;">
          <!-- 대상자 목록 — get_design_context(617:8019, 617:8001) 실측/재실측(2026-08-20).
               Figma상 기OO 행의 파란 배경(Blue/50)은 .table tbody tr:hover(table.css)와 동일한
               색으로, 마우스오버 중인 상태를 캡처한 것으로 판단해 고정 배경이 아니라 hover로만
               나타나게 둔다(정적 인라인 배경 지정 안 함). 마지막 열은 헤더 라벨 없이 행 삭제(X)
               아이콘만. 칼럼폭 2026-08-20 재실측: 이름 120→80, 아이디 auto→80, 직위 160→100,
               역할권한 auto→100, 삭제 60→32(소속은 그대로 auto/flex). -->
          <table class="table" style="table-layout:fixed; width:100%">
            <colgroup>
              <col style="width:10%">
              <col style="width:20%">
              <col style="width:20%">
              <col style="width:20%">
              <col style="width:30%">
            </colgroup>
            <thead>
            <tr>
              <th>코드</th>
              <th>부서명</th>
              <th>전화번호</th>
              <th>펙스번호</th>
              <th>주소</th>
            </tr>
            </thead>
            <tbody id="commonDeptBody">
            </tbody>
          </table>
        </div>

      </div>
      <div class="modal__footer">
        <div class="modal__footer-actions">
          <button type="button" class="btn btn-primary" style="width:80px" data-modal-close>
            <span class="btn-icon-slot"><svg width="11.8667" height="8.53333" viewBox="0 0 11.8667 8.53333" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.2667 0.6L3.93333 7.93333L0.6 4.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            닫기
          </button>
        </div>
      </div>
    </div>
  </div>






</div>
<script src="../../js/modal.js"></script>
<script src="../../js/menu-tree.js"></script>
<script src="../../js/table-row-delete.js"></script>
<script src="../../js/table-col-select-all.js"></script>
<script src="../../js/result-file-list.js"></script>
<script src="../../js/doc-viewer-zoom.js"></script>
<script src="../../js/result-panel-expand.js"></script>
</body>
</html>
