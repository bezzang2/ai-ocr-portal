<!DOCTYPE html>
<!-- Default Layout Import-->
<<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="cross-rule-register-modal">
    <!-- 서식간 Rule 등록 모달 — get_design_context(522:16459) 실측("신청관리-OCR서식신청- 추가팝업" 프레임,
     실제 표시 타이틀은 "서식간 Rule 등록"). OCR업무신청 화면(ocr-task-apply.html)의 "서식간 Rule 목록"
     섹션 "추가" 버튼에서 여는 팝업 — 실제 화면 연결은 개발자가 진행. 
     
     ※ 다른 html 파일과의 함수가 충돌할 수 있기 때문에 prefix로 crrm을 사용한다.
     
     메인 페이지에 아래의 svg가 선언되어 있어야 함. 
     <symbol id="svg_checkbox" viewBox="0 0 12 12">
         <path fill-rule="evenodd" clip-rule="evenodd" d="M9.83263 3.64645C10.0558 3.84171 10.0558 4.15829 9.83263 4.35355L5.2612 8.35355C5.03805 8.54882 4.67624 8.54882 4.45308 8.35355L2.16737 6.35355C1.94421 6.15829 1.94421 5.84171 2.16737 5.64645C2.39052 5.45118 2.75233 5.45118 2.97549 5.64645L4.85714 7.29289L9.02451 3.64645C9.24767 3.45118 9.60948 3.45118 9.83263 3.64645Z" fill="currentColor"/>
     </symbol>
     <symbol id="svg_modal_close" viewBox="0 0 7.725 7.725">
         <path d="M7.2375 0.4875L0.4875 7.2375M0.4875 0.4875L7.2375 7.2375" stroke="currentColor" stroke-width="0.975" stroke-linecap="round" stroke-linejoin="round"/>
     </symbol>
     <symbol id="svg_btn_primary" viewBox="0 0 9.2 6.7">
         <path d="M8.6 0.6L3.1 6.1L0.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
     </symbol>
     <symbol id="svg_btn_secondary" viewBox="0 0 7.725 7.725">
        <path d="M8.6 0.6L3.1 6.1L0.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
     <symbol id="svg_btn_input" viewBox="0 0 10.6667 10.6667">
        <path d="M5.33333 0.666667V10M0.666667 5.33333H10" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/
    </symbol>
    -->
    <div id="cross-rule-register-modal" class="modal-overlay" hidden>
        <div class="modal modal--xl">
            <div class="modal__header">
                <span class="modal__title">서식간 Rule 등록</span>
                <button type="button" class="modal__close" aria-label="닫기" data-modal-close>
                    <svg width="7.725" height="7.725" fill="none" aria-hidden="true">
                        <use href="#svg_modal_close" />
                    </svg>
                </button>
            </div>
            <div class="modal__body">
                <!-- 규칙명/비교유형 + "Input 항목 추가" — patterns/detail-panel.css(2026-08-20)
                    재실측 반영. 이전엔 .sub__search-area(회색 채움)였는데, get_design_context(522:16459)
                    재확인 결과 흰 배경+Neutral/100 보더 박스라 공용 클래스로 교체했다. -->
                <div class="detail-panel" style="justify-content:space-between">
                    <div style="display:flex; align-items:center; gap:36px">
                        <div class="split-view__search-item">
                            <span class="split-view__search-label">규칙명</span>
                            <input class="input" style="width:200px" type="text" name="crrm_rule_name" id="crrm_rule_name" value="" placeholder="규칙명을 입력하세요.">
                        </div>
                        <div class="split-view__search-item split-view__search-item--tight">
                            <span class="split-view__search-label">비교유형</span>
                            <select class="input" style="width:160px" id="crrm_rule_type" name="crrm_rule_type">
                                <option value="EQ">일치(EQUALS)</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-neutral btn-neutral--fill" onclick="crrmInput();">
                        <span class="btn-icon-slot">
                            <svg width="10.6667" height="10.6667" fill="none" aria-hidden="true">
                                <use href="#svg_btn_input" />
                            </svg>
                        </span>
                        Input 항목
                    </button>
                </div>
    
                <!-- 서식별 항목 선택 그리드 -->
                <div class="rule-field-box">
                    <div class="rule-field-grid modal-rule-grid">
                        <!-- 서식 동적 적용 Area -->
                    </div>
                </div>
    
            </div>
            <div class="modal__footer">
                <div class="modal__footer-actions">
                    <button type="button" class="btn-outline-primary" data-modal-close>
                        <span class="btn-icon-slot">
                            <svg width="7.725" height="7.725" fill="none" aria-hidden="true">
                                <use href="#svg_btn_secondary" />
                            </svg>
                        </span>
                        취소
                    </button>
                    <button type="button" class="btn btn-primary" data-modal-close th:onclick="crrmSave();">
                        <span class="btn-icon-slot">
                            <svg width="9.2" height="6.7" fill="none" aria-hidden="true">
                                <use href="#svg_btn_primary" />
                            </svg>
                        </span>
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript" type="text/javascript">
    /**
     * 서식간 rule 추가 팝업에 workflow룰 추가한다.
     *
     * @param type (0: 서식, 1:업무)
     * @param wkflowId
     * @param wkflowNm
     */
    function CrossRuleRegist_add(type, wkflow){
        let options = '';
        for(field of wkflow.fields){
            options += '<option value="' + field.path + '">' + field.path + '</option>';
        }
        
        html = `
            <div class="rule-field-card crrm-rule-card" data-id="${wkflow.id}" data-type="${type}" data-name="${wkflow.name}">
                <label class="checkbox checkbox--lg">
                    <input type="checkbox" class="checkbox__input" checked>
                    <span class="checkbox__box">
                        <svg fill="none" aria-hidden="true">
                            <use href="#svg_checkbox" />
                        </svg>
                    </span>
                </label>
                <div class="rule-field-card__info">
                    <span class="rule-field-card__label">${wkflow.name}</span>
                    <select class="input input--sm" style="width:160px">
                       ${options}
                    </select>
                </div>
            </div>
        `;

        $(".modal-rule-grid").append(html);
    }
    
    /**
     * 서식간 rule 추가 팝업에 workflow룰 삭제한다.
     *
     * @param wkflowId
     */
    function CrossRuleRegist_remove(wkflowId){
  	   $(".crrm-rule-card").each(function(index, item){
  	        let tempId = item.dataset.id;

  	        if(tempId == wkflowId ){
  	            $(this).remove();
  	        }
  	    });
    }

    /**
     * Input 버튼 이벤트
     *
     */
    function crrmInput(){
    	openInformationModal("정확한 요건 정의 필요", function(){
    	});
    }
    
    /**
     * 저장 버튼 이벤트
     *
     */
    function crrmSave(){
        //  1. rule 그룹 데이터 세팅
        let ruleGroup = {
            "idx": gRuleGroups.length,
            "name": $("#crrm_rule_name").val(),
            "type": $("#crrm_rule_type").val(),
            "typeName": $("#crrm_rule_type").text().trim(),
            "wkflows" : [],
            "delYn": false,
            "displayYn": false
        };

        $(".crrm-rule-card").each(function(index, item){
            if(item.getElementsByTagName('input')[0].checked){
                let wkflow = {
                    id: item.dataset.id,
                    name: item.dataset.name,
                    type: item.dataset.type,
                    value: item.getElementsByTagName('select')[0].value
                };

                ruleGroup.wkflows.push(wkflow);
            }
        });
        
        if(ruleGroup.wkflows.length < 2 ){
        	openInformationModal("2개 이상의 서식이 포함되어야 합니다.", function(){
            });
        	return;
        }

        console.log("ruleSetGroups => ", ruleGroup);
        callback_CrossRuleRegister(ruleGroup);
    }
    </script>
</div>
</body>
</html>
