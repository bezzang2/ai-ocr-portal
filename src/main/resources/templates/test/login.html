<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <!--Common Head-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, minimum-scale=1, user-scalable=yes,initial-scale=1.0"/>
    <title th:text="${title}"></title>

    <!--Common JS-->
    <script th:inline="javascript" type="text/javascript" th:src="@{/js/bootstrap.min.js}"></script>
    <script th:inline="javascript" type="text/javascript" th:src="@{/js/jquery-4.0.0.js}"></script>
    <script th:inline="javascript" type="text/javascript" th:src="@{/js/jquery-ui.min.js}"></script>

    <!--Common CSS -->
    <link th:inline="css" th:href="@{/css/bootstrap.css}" rel="stylesheet"/>
    <link th:inline="css" th:href="@{/css/jquery-ui.min.css}" rel="stylesheet"/>

    <style th:inline="css">
        .form-signin {
            max-width: 330px;
            padding: 1rem;
        }

        .form-signin .form-floating:focus-within {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>

    <!-- inline JS 영역-->
    <script th:inline="javascript" type="text/javascript">
        function signin(){
            fetch("/api/v1/test/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    userId: $("#userId").val(),
                    passwd: $("#passwd").val()
                }),
            })
            .then((response) => response.json())
            .then((res) => {
                if(res.status == 200) {
                    alert("로그인 되었습니다.");
                	location.href = "/test";  
                }
                else{
                    alert(res.message + "[" + res.status + "]");
                }
            });
        }
    </script>

</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-signin w-100 m-auto">
        <form name="form1">
            <h1 class="h3 mb-3 fw-normal">로그인</h1>
            <div class="form-floating">
                <input type="text" class="form-control" id="userId" name="userId" value="agilesoda1" placeholder="사원번호">
                <label for="userId">아이디</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="passwd" name="passwd" value="agilesoda1!" placeholder="비밀번호">
                <label for="passwd">비밀번호</label>
            </div>
            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault">Remember me
                </label>
            </div>
            <a class="btn btn-primary w-100 py-2" href="javascript:signin();">Sign in</a>
            <p class="mt-5 mb-3 text-body-secondary">&copy;2017–2025</p>
        </form>
    </main>
</body>
</html>
