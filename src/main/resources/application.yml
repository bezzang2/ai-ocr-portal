#mybatis ??
mybatis:
  mapper-locations: classpath:sqlmap/mapper/*.xml
  config-location: classpath:sqlmap/config/mybatis-config.xml

# log4j2 설정
logging:
  config: classpath:log4j2-spring.xml

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui-custom.html
    enabled: true
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  model-and-view-allowed: true
