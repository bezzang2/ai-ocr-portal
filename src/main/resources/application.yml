  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#mybatis ??
mybatis:
  mapper-locations: classpath:sqlmap/mapper/*.xml
  config-location: classpath:sqlmap/config/mybatis-config.xml

# p6spy-spring-boot-starter Configuration
decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      # SQL을 한 줄로 정렬해서 보여줄지 여부
      multiline: true

# spring-boot-starter-log4j2 Configuration

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type.descriptor.sql: trace
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui-custom.html
    enabled: true
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  model-and-view-allowed: true
