plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.agilesoda.portal'
version = '0.1.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// 의존성 버전을 gradle.lockfile 로 고정한다. 은행 오프라인 캐시(scripts/gradle_offline_cache.sh)와 같은 버전으로만 빌드한다.
// 의존성을 바꾸면 ./gradlew dependencies --write-locks 로 lockfile 을 다시 만들고 함께 커밋한다.
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.3.0'
	compileOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	//	thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    
    //  mybatis
    //runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    
    //  JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    //	log4j2
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

	//  swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    
    //  Tika
    implementation 'org.apache.tika:tika-core:3.1.0'
    implementation 'org.apache.tika:tika-parsers:3.1.0'
    
    //	POI
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    implementation 'net.sf.json-lib:json-lib:2.4:jdk15'

	implementation fileTree(dir: 'libs', includes: ['*.jar'])

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}


configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

war {
	version = '0.3.1'	//	TASK, feature/2310155 머지
}

// Override only the patch artifact name; retain normal build behavior.
tasks.named('bootWar') {
    if (project.hasProperty('patchVersion')) {
        archiveFileName = "portal-${project.property('patchVersion')}.war"
    }
}
